name: live-fleet-diag
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: count only (zero values in output)
        env:
          LIVE_FLEET_KEYS: ${{ secrets.LIVE_FLEET_KEYS }}
        run: |
          printf '%s' "$LIVE_FLEET_KEYS" > /tmp/lfk.json
          cat > /tmp/diag.js <<'DIAGEOF'
          const fs = require('fs');
          const v = fs.readFileSync('/tmp/lfk.json', 'utf8');
          try {
            const j = JSON.parse(v);
            const w = new Set();
            (function w2(n, d) {
              if (!n || typeof n !== 'object' || d > 8) return;
              if (Array.isArray(n)) { n.forEach(x => w2(x, d + 1)); return; }
              for (const x of Object.values(n)) {
                if (typeof x === 'string' && /^[5JK][1-9A-HJ-NP-Za-km-z]{50}$/.test(x)) w.add(x);
                else if (typeof x === 'object') w2(x, d + 1);
              }
            })(j, 0);
            console.log('diag: wif-count=' + w.size + ' has-rekey4=' + ('rekey4_harvest' in j) + ' top-keys=' + Object.keys(j).join(','));
          } catch (e) { console.log('diag: unparsable len=' + v.length); }
          DIAGEOF
          node /tmp/diag.js