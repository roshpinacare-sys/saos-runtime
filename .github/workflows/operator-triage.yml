# OPERATOR-TRIAGE — ניתוב-טענות-המפעיל לאוטונומיה (R324 · «הריבונות היא המפעיל,
# טענות-למפעיל צריכות-להיות מנותבות לאוטונומיה»).
#
# issue-נפתח → תשובה-אוטונומית: פסק-המפה החיה + הזרמת-הזרימות הבטוחות (canary-gated)
# לפי מילות-מפתח. כל-יום 09:04 → סריקת-אדומים → issue «תור-תיקון אוטונומי» אחד חי
# (פתיחה/עדכון/סגירה-כנה). המפעיל לא צריך לרדוף אחרי-המערכת — המערכת רודפת-אחרי-הסדר.
# fail-soft: הנתב לעולם לא אדום — הוא לעולם לא יוצר מיילים.
name: operator-triage

on:
  issues:
    types: [opened]
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: operator-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - name: Route operator claims to the autonomy (fail-soft, never red)
        run: node ops/operator-triage/triage.cjs
