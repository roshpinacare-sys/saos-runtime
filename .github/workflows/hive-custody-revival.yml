# hive-custody-revival (saos-runtime) — fail-closed HIVE custody check + heartbeat.
# Owner order 2026-10-17 ("תמשיך ודחוף" + standing "אתה יכול לחתום בקופה").
# Runner-only secrets are judged against the LIVE chain authorities; the
# sha-pinned GEN-1 vault (from roshpinacare-sys/steem, outer sha verified) is
# opened with the Actions-held pass bundle; if a live HIVE posting authority is
# held, ONE posting-only weave heartbeat is signed and its SIGNED tx (public
# material) is emitted for our public non-custodial relay. Secrets never print.
name: hive-custody-revival
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hive-custody-revival
  cancel-in-progress: false
jobs:
  revive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: fetch sha-pinned GEN-1 vault blob (public ciphertext)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -sL -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/roshpinacare-sys/steem/contents/agent/vault/KEYS-ZIP-2026-09-10.zip.enc" -o gen1.zip.enc
          echo "outer-sha256: $(sha256sum gen1.zip.enc | cut -d' ' -f1)"
          test "$(sha256sum gen1.zip.enc | cut -d' ' -f1)" = "c2e0dfd5053e3734a1fba8058cba30297780e0794504b2bfc5b511d79aa6d0b9"
      - name: judge custody + sign heartbeat (secrets never printed)
        env:
          STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
          GH_PAT: ${{ secrets.GH_PAT }}
          ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
          MAIN_KEY: ${{ secrets.MAIN_KEY }}
          ROT_ROSTER: ${{ secrets.ROT_ROSTER }}
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
          CI_ADOPT_WIF_POSTING: ${{ secrets.CI_ADOPT_WIF_POSTING }}
          CI_ADOPT_WIF_ACTIVE: ${{ secrets.CI_ADOPT_WIF_ACTIVE }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
          GEN1_INNER_SHA: "1392b18e79256d0e3c4908b6dd148c1ec824f3fd25d6e4350367a05002b91ea6"
        run: |
          set -o pipefail
          mkdir -p /tmp/hr
          cp scripts/hive-revival.mjs /tmp/hr/
          cd /tmp/hr && bun init -y >/dev/null 2>&1 || true
          bun add @noble/secp256k1@2 @noble/hashes@1 bs58@6 >/dev/null
          cp "$GITHUB_WORKSPACE/gen1.zip.enc" /tmp/hr/gen1.zip.enc
          sed -i 's|process.env.GEN1_ZIP_B64|fs.readFileSync("gen1.zip.enc").toString("base64")|' /tmp/hr/hive-revival.mjs
          bun /tmp/hr/hive-revival.mjs 2>&1 | sed 's/x-access-token:[^@]*/x-access-token:<REDACTED>/g'
      - uses: actions/upload-artifact@v4
        with:
          name: signed-tx
          path: /tmp/hr/signed-tx.b64
          retention-days: 3
