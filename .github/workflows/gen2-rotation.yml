# gen2-rotation.yml — N1/D3 (T-63) + T-68 repair (examine-and-fix pulse, trace 1a130a768c39d211).
#
# WHY in-runner: STEEM_VAULT_PASSES (the era bundle) is readable ONLY inside Actions (write-only API).
# The bundle holds gen1 (seed-vault era) + recovery-3 — neither is reconstructable outside,
# so the gen2 era MUST be merged where the bundle lives. Zero pass material in code/logs/inputs.
#
# T-68 REPAIR (measured): the T-63 file referenced KEYS-ZIP-2026-10-09.zip.enc which no longer
# exists at steem HEAD — MASTER-DERIVE (2da16cb2) moved custody of record to the file pinned in
# recovery-meta.json (meta.keysZipFile). This repair makes the lane meta-driven (custody-of-record
# follows the meta, never a hardcoded filename) and adds CONVERGE mode: if the bundle already
# carries gen2 (rotated 00:11Z but its file-push silently died — the T-67 false-OK bug), the lane
# re-seals the custody-of-record under the EXISTING bundle gen2 pass (no double-rotation) and
# converges files+metas to the bundle. Rotate mode (no gen2 in bundle) behaves as T-63 did.
#
# Fail-closed: nothing is pushed unless round-trip verifies and the steem push is re-fetched
# and compared (push-verify law — the false-OK bug dies here).
name: gen2-rotation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = converge-if-present · rotate = fresh-merge (refuses if gen2 present) · rotate-replace = fresh pass replacement (leak heal)"
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: gen2-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Preflight (bundle present, fail-loud otherwise — honest death beats silent forgery)
        run: |
          set -Eeuo pipefail
          if [ -z "${STEEM_VAULT_PASSES:-}" ]; then echo "ABORT: STEEM_VAULT_PASSES absent"; exit 1; fi
          node -e "JSON.parse(process.env.STEEM_VAULT_PASSES)" || { echo "ABORT: bundle not valid JSON"; exit 1; }
          node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); const need=['recovery-3.keysZipUnlock','recovery-3.keysBackupUnlock']; for(const ref of need){let v=b; for(const k of ref.split('.')){ if(!(k in (v||{}))) { console.error('ABORT: bundle missing '+ref); process.exit(1);} v=v[k]; } if(typeof v!=='string'||v.length<8){ console.error('ABORT: bundle value malformed '+ref); process.exit(1);} }"
          if [ -z "${GH_PAT:-}" ]; then echo "ABORT: GH_PAT absent"; exit 1; fi
          INPUT_MODE="${{ inputs.mode || 'auto' }}"
          if node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.exit(b.gen2&&b.gen2.keysZipUnlock?0:1)"; then HASG2=1; else HASG2=0; fi
          case "$INPUT_MODE" in
            auto)
              if [ "$HASG2" = "1" ]; then MODE=converge; else MODE=rotate; fi ;;
            rotate)
              if [ "$HASG2" = "1" ]; then echo "ABORT: rotate refused — gen2 already present (double-rotation guard)"; exit 1; fi
              MODE=rotate ;;
            rotate-replace)
              echo "rotate-replace: fresh passes will REPLACE the existing gen2 era (leak-heal law)"
              MODE=rotate ;;
            *) echo "ABORT: unknown mode $INPUT_MODE"; exit 1 ;;
          esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "INPUT_MODE=$INPUT_MODE" >> "$GITHUB_ENV"
          if [ "$MODE" = "converge" ]; then
            echo "preflight OK — bundle already carries gen2 era → CONVERGE mode (files+metas converge to bundle; no double-rotation)"
          else
            echo "preflight OK — ROTATE mode (fresh passes, era-merge, secret PUT)"
          fi
          echo "bundle eras: $(node -e "console.log(Object.keys(JSON.parse(process.env.STEEM_VAULT_PASSES)).join(','))")"

      - name: "GEN-2 passes — rotate: fresh in-runner env-only · converge: reuse bundle era"
        run: |
          set -Eeuo pipefail
          if [ "${MODE:-rotate}" = "converge" ]; then
            G2ZIP="$(node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write(b.gen2.keysZipUnlock||'')")"
            G2BKP="$(node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write((b.gen2.keysBackupUnlock||b.gen2.keysZipUnlock)||'')")"
            echo "converge: using existing bundle gen2 passes (lengths: ${#G2ZIP}/${#G2BKP})"
          else
            G2ZIP="$(openssl rand -base64 24 | tr '+/' '-_' | tr -d '\n')"
            G2BKP="$(openssl rand -base64 24 | tr '+/' '-_' | tr -d '\n')"
            echo "rotate: fresh passes generated (lengths: ${#G2ZIP}/${#G2BKP})"
          fi
          [ -n "$G2ZIP" ] && [ -n "$G2BKP" ] || { echo "ABORT: gen2 passes empty"; exit 1; }
          # MASK LAW (T-68): GITHUB_ENV values are echoed raw in step headers — register masks
          # BEFORE any later step can print them. This closes the 00:11Z log-leak class forever.
          echo "::add-mask::$G2ZIP"
          echo "::add-mask::$G2BKP"
          {
            echo "G2ZIP<<EOF"; echo "$G2ZIP"; echo "EOF";
            echo "G2BKP<<EOF"; echo "$G2BKP"; echo "EOF";
          } >> "$GITHUB_ENV"

      - name: Checkout steem main (the vault of record)
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${GH_PAT}@github.com/roshpinacare-sys/steem.git" steem
          cd steem
          echo "steem main @ $(git rev-parse --short HEAD)"

      - name: Re-seal custody-of-record under GEN-2 (meta-driven, round-trip verified, inner sha pinned)
        working-directory: steem
        run: |
          set -Eeuo pipefail
          ZIP_SRC="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('agent/recovery-meta.json','utf8')).keysZipFile||'')")"
          BKP_SRC="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('agent/recovery-meta.json','utf8')).keysBackupFile||'')")"
          [ -n "$ZIP_SRC" ] || { echo "ABORT: meta.keysZipFile absent — custody-of-record unknown"; exit 1; }
          [ -f "$ZIP_SRC" ] || { echo "ABORT: $ZIP_SRC missing at HEAD — custody drift, refusing to guess"; exit 1; }
          [ -n "$BKP_SRC" ] && [ -f "$BKP_SRC" ] || { echo "ABORT: backup source ($BKP_SRC) missing at HEAD"; exit 1; }
          echo "custody-of-record: $ZIP_SRC + $BKP_SRC (from recovery-meta.json)"
          METAZIP="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('agent/recovery-meta.json','utf8')).keysZipPass||'')")"
          METABKP="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('agent/recovery-meta.json','utf8')).keysBackupPass||'')")"
          mkdir -p /tmp/g2 && chmod 700 /tmp/g2
          # decrypt ladder: meta pass (custody-of-record), then bundle eras (recovery-3, gen1, gen2) — env-only
          dec() { # dec <in> <out> <cand1> [cand2...]
            local inf="$1" out="$2"; shift 2
            for c in "$@"; do
              [ -n "$c" ] || continue
              if C1="$c" openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in "$inf" -out "$out" -pass env:C1 2>/dev/null; then return 0; fi
            done
            return 1
          }
          BUN_R3ZIP="$(node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write((b['recovery-3']&&b['recovery-3'].keysZipUnlock)||'')")"
          BUN_G1ZIP="$(node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write((b.gen1&&b.gen1.keysZipUnlock)||'')")"
          BUN_G2ZIP="$(node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write((b.gen2&&b.gen2.keysZipUnlock)||'')")"
          BUN_R3BKP="$(node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write((b['recovery-3']&&b['recovery-3'].keysBackupUnlock)||'')")"
          BUN_G1BKP="$(node -e "const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write((b.gen1&&b.gen1.keysBackupUnlock)||'')")"
          dec "$ZIP_SRC" /tmp/g2/keys.zip "$METAZIP" "$BUN_R3ZIP" "$BUN_G1ZIP" "$BUN_G2ZIP" || { echo "ABORT: keys zip decrypt failed on all candidate passes (custody-of-record: $ZIP_SRC)"; exit 1; }
          dec "$BKP_SRC" /tmp/g2/keys.tar "$METABKP" "$BUN_R3BKP" "$BUN_G1BKP" || { echo "ABORT: backup decrypt failed on all candidate passes ($BKP_SRC)"; exit 1; }
          INNER_ACTUAL="$(sha256sum /tmp/g2/keys.zip | cut -d' ' -f1)"
          INNER_EXPECT="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('agent/recovery-meta.json','utf8')).keysZipInnerSha256||'')")"
          if [ -n "$INNER_EXPECT" ] && [ "$INNER_ACTUAL" != "$INNER_EXPECT" ]; then echo "ABORT: inner sha mismatch ($INNER_ACTUAL != $INNER_EXPECT) — payload drift, refusing"; exit 1; fi
          # re-seal under GEN-2
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -in /tmp/g2/keys.zip -out agent/vault/KEYS-ZIP-GEN2-$(date -u +%Y-%m-%d).zip.enc -pass env:G2ZIP
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -in /tmp/g2/keys.tar -out agent/vault/KEYS-BACKUP-GEN2-$(date -u +%Y-%m-%d).tar.enc -pass env:G2BKP
          # round-trip proofs
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in agent/vault/KEYS-ZIP-GEN2-$(date -u +%Y-%m-%d).zip.enc -out /tmp/g2/rt.zip -pass env:G2ZIP
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in agent/vault/KEYS-BACKUP-GEN2-$(date -u +%Y-%m-%d).tar.enc -out /tmp/g2/rt.tar -pass env:G2BKP
          [ "$(sha256sum /tmp/g2/rt.zip | cut -d' ' -f1)" = "$INNER_ACTUAL" ] || { echo "ABORT: gen2 zip roundtrip mismatch"; exit 1; }
          [ "$(sha256sum /tmp/g2/rt.tar | cut -d' ' -f1)" = "$(sha256sum /tmp/g2/keys.tar | cut -d' ' -f1)" ] || { echo "ABORT: gen2 tar roundtrip mismatch"; exit 1; }
          rm -f /tmp/g2/keys.zip /tmp/g2/keys.tar /tmp/g2/rt.zip /tmp/g2/rt.tar
          echo "round-trip verified: zip inner-sha MATCH, tar roundtrip MATCH"
          echo "ZIPFILE=agent/vault/KEYS-ZIP-GEN2-$(date -u +%Y-%m-%d).zip.enc" >> "$GITHUB_ENV"
          echo "BKPFILE=agent/vault/KEYS-BACKUP-GEN2-$(date -u +%Y-%m-%d).tar.enc" >> "$GITHUB_ENV"

      - name: Build recovery-meta v3 + GEN-2-ERA-META (refs for the engine path; lengths only in the era record)
        working-directory: steem
        run: |
          set -Eeuo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const m = JSON.parse(fs.readFileSync('agent/recovery-meta.json', 'utf8'));
          const now = new Date().toISOString();
          const shaF = f => crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const zipFile = process.env.ZIPFILE, bkpFile = process.env.BKPFILE;
          const mode = process.env.MODE || 'rotate';
          const v3 = {
            ...m,
            keysZipPass: process.env.G2ZIP,
            keysZipFile: zipFile,
            keysZipSha256: shaF(zipFile),
            keysZipInnerSha256: m.keysZipInnerSha256,
            keysBackupPass: process.env.G2BKP,
            keysBackupFile: bkpFile,
            keysBackupSha256: shaF(bkpFile),
            replacedArchive: m.keysZipFile + ' (kept in history; GEN-2-2026-10-12 — passphrase rotation by the sovereignty, owner directive trace 1a12…f45d; T-68 repair: meta-driven source, ' + mode + ' mode; payload identical, inner sha unchanged)',
            sealedAt: now,
            keysZipUnlockRef: 'gen2.keysZipUnlock',
            keysBackupUnlockRef: 'gen2.keysBackupUnlock',
            format: 'recovery-meta-3',
            rotation: {
              id: 'GEN-2-2026-10-12', prior: (m.rotation && m.rotation.id) || 'T50-TRUTH1',
              masterPasswordRef: 'gen2.keysZipUnlock (STEEM_VAULT_PASSES bundle, steem + saos-runtime secrets) — repo-side system custody unchanged (operator doctrine 2026-09-10)',
              note: 'Executed by the runner itself (gen2-rotation.yml, T-68 repair): ' + mode + ' mode; round-trip verified, inner sha pinned. GEN-1/T50 values superseded for the ACTIVE bundle; historical archives stay GEN-1-decryptable (documented boundary — passphrase rotation cannot re-protect already-published ciphertext; on-chain key-material rotation is a separate higher operation). PERSONAS_KEY escrow = armed decision D3b (Domain write-only secret).',
            },
            personasEscrow: { status: 'armed', decidedIn: 'T-63 D3b, trace 1a12…f45d', detail: 'PERSONAS_KEY lives in Domain repo secrets (write-only by design); escrow into this vault at the next Domain keeper window' },
          };
          fs.writeFileSync('agent/recovery-meta.json', JSON.stringify(v3, null, 2) + '\n');
          const era2 = {
            format: 'gen-2-era-meta', createdAt: now,
            createdBy: 'gen2-rotation.yml (saos-runtime) — T-63 D3 + T-68 repair, owner directive trace 1a12…f45d',
            eras: {
              gen1: { status: 'preserved-in-bundle', passLengths: { keysZipUnlock: 32, keysBackupUnlock: 32 }, note: 'untouched — seed-vault era (KEYS-SEED-2026-10-04) resolves through it' },
              'recovery-3': { status: 'superseded-for-active-bundle', passLengths: { keysZipUnlock: 32, keysBackupUnlock: 32 }, note: 'values preserved in bundle' },
              gen2: { status: 'ACTIVE', mode: mode, passLengths: { keysZipUnlock: process.env.G2ZIP.length, keysBackupUnlock: process.env.G2BKP.length }, bundleRef: 'gen2.* (STEEM_VAULT_PASSES, steem + saos-runtime)', files: [zipFile, bkpFile], innerShasUnchanged: true },
            },
            proof: 'round-trip verified in-runner; inner sha256 of the keys zip pinned to recovery-meta and MATCHED pre-rotation',
            boundaries: [
              'historical archives in git history stay GEN-1/recovery-3-decryptable — passphrase rotation cannot re-protect already-published ciphertext (documented, not hidden)',
              'on-chain key-material rotation = separate higher operation (recorded boundary)',
              'repo-side system custody (values in private repo per operator doctrine 2026-09-10) continues; full off-repo migration of repo-side consumers (absorb-sheet-vault, sovereign-selfcustody, vault-revival, integrations-revival, toolbelt-revival) = recorded custody-lane follow-up',
              'PERSONAS_KEY escrow = armed D3b (Domain write-only secret)',
            ],
          };
          fs.writeFileSync('agent/vault/GEN-2-ERA-META.json', JSON.stringify(era2, null, 2) + '\n');
          console.log('recovery-meta v3 + GEN-2-ERA-META written (mode=' + mode + '; pass values only in v3 per operator doctrine; era record lengths-only)');
          NODE

      - name: "Merge era bundle + PUT secrets on steem + saos-runtime — converge: idempotent re-PUT · rotate: era-merge"
        working-directory: steem
        run: |
          set -Eeuo pipefail
          npm i --no-save libsodium-wrappers --silent
          node - <<'NODE'
          const fs = require('fs');
          const sodium = require('libsodium-wrappers');
          const bundle = JSON.parse(process.env.STEEM_VAULT_PASSES);
          const mode = process.env.MODE || 'rotate';
          const REPLACE = (process.env.INPUT_MODE === 'rotate-replace');
          if (mode === 'rotate' && bundle.gen2 && bundle.gen2.keysZipUnlock && !REPLACE) { console.error('ABORT: rotate mode but gen2 present — refusing to double-rotate'); process.exit(1); }
          if (mode === 'rotate') bundle.gen2 = { keysZipUnlock: process.env.G2ZIP, keysBackupUnlock: process.env.G2BKP };
          const PAT = process.env.GH_PAT;
          const H = { Authorization: `Bearer ${PAT}`, Accept: 'application/vnd.github+json' };
          const put = async (repo) => {
            const pkr = await fetch(`https://api.github.com/repos/roshpinacare-sys/${repo}/actions/secrets/public-key`, { headers: H });
            if (!pkr.ok) throw new Error(`public-key ${repo}: HTTP ${pkr.status}`);
            const pk = await pkr.json();
            await sodium.ready;
            const sealed = sodium.crypto_box_seal(Buffer.from(JSON.stringify(bundle), 'utf8'), Buffer.from(pk.key, 'base64'));
            const r = await fetch(`https://api.github.com/repos/roshpinacare-sys/${repo}/actions/secrets/STEEM_VAULT_PASSES`, {
              method: 'PUT', headers: { ...H, 'Content-Type': 'application/json' },
              body: JSON.stringify({ encrypted_value: Buffer.from(sealed).toString('base64'), key_id: pk.key_id }),
            });
            if (r.status !== 201 && r.status !== 204) throw new Error(`secret PUT ${repo}: HTTP ${r.status}`);
            console.log(`secret STEEM_VAULT_PASSES on ${repo}: HTTP ${r.status} (mode=${mode}, replace=${REPLACE}, eras: ${Object.keys(bundle).join(',')})`);
          };
          (async () => { await put('steem'); await put('saos-runtime'); })().catch(e => { console.error('ABORT:', e.message); process.exit(1); });
          NODE

      - name: Push vault files + metas to steem main (FF-only, one commit, PUSH-VERIFY law)
        working-directory: steem
        run: |
          set -Eeuo pipefail
          git config user.name "saos-runtime-ci"
          git config user.email "saos-runtime-ci@users.noreply.github.com"
          git add agent/vault/KEYS-ZIP-GEN2-*.zip.enc agent/vault/KEYS-BACKUP-GEN2-*.tar.enc agent/recovery-meta.json agent/vault/GEN-2-ERA-META.json
          if git diff --cached --quiet; then
            echo "CONVERGED-ALREADY: vault files+metas match the bundle state (honest no-op)"
          else
            git commit -m "custody(T-68 repair): GEN-2 custody convergence - meta-driven source (follows MASTER-DERIVE custody-of-record), re-sealed under bundle gen2 era (roundtrip verified, inner sha pinned), recovery-meta v3 + GEN-2-ERA-META"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then PUSHED=1; break; fi
              echo "retry $i"; sleep 5
            done
            [ "$PUSHED" = "1" ] || { echo "PUSH-FAIL: 3 attempts exhausted — failing honestly (false-OK law)"; exit 1; }
            sleep 2
            git fetch -q origin main
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || { echo "PUSH-VERIFY-FAIL: HEAD != origin/main"; exit 1; }
            echo "pushed+verified: $(git rev-parse --short HEAD)"
          fi

      - name: Honest summary (lengths and shas only — zero pass material)
        run: |
          echo "GEN-2 lane complete (mode=$MODE). Active custody re-sealed under gen2 era; eras preserved; secrets converged on steem + saos-runtime; steem main push-verified."
          echo "T-68 repair notes: source follows recovery-meta.json custody-of-record (no hardcoded filenames); CONVERGE mode heals the 00:11Z silent-push failure without double-rotation."
          echo "Boundaries recorded in GEN-2-ERA-META.json. PERSONAS_KEY escrow = armed D3b."
