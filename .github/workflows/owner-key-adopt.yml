# owner-key-adopt.yml — adopts the owner's posting key onto the live account authorities.
# Law: fail-closed. The secret active WIF is parsed -> derived pubkey compared against the
# LIVE active authority BEFORE any broadcast. No match = refuse, nothing leaves the runner.
# dsteem (proven dry-sign of account_update2 with absent-optional serialization).
# The key is never logged, never printed, never written to disk.
name: owner-key-adopt

on:
  workflow_dispatch:
    inputs:
      account:
        description: 'account to update'
        default: 'headcorner'
      new_posting_pub:
        description: 'posting pubkey to ADD (weight 1, existing keys preserved)'
        default: 'STM8StTG4aesGfmAUgBpMU9LKvoz98E5uz9eCCtEUvYM8Ywk398TD'
      dry_run:
        description: 'true = validate + dry-sign only (no broadcast)'
        default: 'true'

permissions:
  contents: read

concurrency:
  group: owner-key-adopt
  cancel-in-progress: false

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
      IN_ACCOUNT: ${{ github.event.inputs.account }}
      IN_PUB: ${{ github.event.inputs.new_posting_pub }}
      IN_DRY: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate + adopt (fail-closed, key never logged)
        run: |
          set -Eeuo pipefail
          npm install --prefix /tmp/dsteem dsteem@0.11.3 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/dsteem/node_modules node << 'EOS'
          const dsteem = require('dsteem');
          const ACCOUNT = (process.env.IN_ACCOUNT || 'headcorner').trim();
          const NEWPUB = (process.env.IN_PUB || 'STM8StTG4aesGfmAUgBpMU9LKvoz98E5uz9eCCtEUvYM8Ywk398TD').trim();
          const DRY = String(process.env.IN_DRY ?? 'true') === 'true';
          const WIF = (process.env.STEEM_ACTIVE_WIF || '').trim();
          const fail = (v, r) => { console.log(JSON.stringify({ verdict: v, reason: String(r).slice(0, 400) })); process.exit(1); };
          if (!WIF) fail('NO-SECRET', 'STEEM_ACTIVE_WIF missing in repo secrets');
          if (!/^STM[1-9A-HJ-NP-Za-km-z]{50,52}$/.test(NEWPUB)) fail('BAD-PUB', 'new posting pub malformed');
          const client = new dsteem.Client(['https://api.justyy.com', 'https://api.steemit.com']);
          let priv;
          try { priv = dsteem.PrivateKey.fromString(WIF); } catch (e) { fail('BAD-WIF', e.message); }
          const derived = priv.createPublic().toString();
          (async () => {
            const accs = await client.database.getAccounts([ACCOUNT]).catch((e) => fail('ACCOUNT-LOOKUP-FAIL', e.message));
            const a = accs[0];
            if (!a) return fail('ACCOUNT-LOOKUP-FAIL', 'no account');
            const liveActive = (a.active && a.active.key_auths ? a.active.key_auths : []).map((x) => x[0]);
            const livePosting = (a.posting && a.posting.key_auths ? a.posting.key_auths : []).map((x) => x[0]);
            const thr = (a.posting && a.posting.weight_threshold) != null ? a.posting.weight_threshold : 1;
            if (!liveActive.includes(derived)) {
              return fail('ACTIVE-AUTHORITY-MISMATCH', 'derived key ' + derived.slice(0, 14) + '... is NOT the live active authority — broadcast refused, nothing left the runner');
            }
            if (livePosting.includes(NEWPUB)) {
              console.log(JSON.stringify({ verdict: 'ALREADY-REGISTERED', posting: livePosting }));
              process.exit(0);
            }
            const newPosting = {
              weight_threshold: thr,
              account_auths: (a.posting && a.posting.account_auths) || [],
              key_auths: [...livePosting.map((k) => [k, 1]), [NEWPUB, 1]],
            };
            const op = ['account_update2', {
              account: ACCOUNT,
              owner: undefined,
              active: undefined,
              posting: newPosting,
              memo_key: undefined,
              json_metadata: '',
              posting_json_metadata: '',
              extensions: [],
            }];
            if (DRY) {
              const props = await client.database.getDynamicGlobalProperties().catch((e) => fail('DGP-FAIL', e.message));
              const tx = {
                ref_block_num: props.head_block_number & 0xffff,
                ref_block_prefix: Buffer.from(props.head_block_id, 'hex').readUInt32LE(4),
                expiration: new Date(new Date(props.time + 'Z').getTime() + 60000).toISOString().slice(0, -5),
                extensions: [],
                operations: [op],
              };
              const signed = await client.broadcast.sign(tx, [priv]).catch((e) => fail('DRY-SIGN-FAIL', e.message));
              console.log(JSON.stringify({ verdict: 'DRY-RUN-OK', derived: derived.slice(0, 14) + '...', would_set_posting: newPosting, dry_sigs: signed.signatures.length }));
              process.exit(0);
            }
            const res = await client.broadcast.sendOperations([op], [priv]).catch((e) => fail('BROADCAST-FAIL', e.message));
            await new Promise((r) => setTimeout(r, 4000));
            const accs2 = await client.database.getAccounts([ACCOUNT]).catch((e) => fail('VERIFY-LOOKUP-FAIL', e.message));
            const p2 = (accs2[0].posting && accs2[0].posting.key_auths ? accs2[0].posting.key_auths : []).map((x) => x[0]);
            const ok = p2.includes(NEWPUB) && livePosting.every((k) => p2.includes(k));
            console.log(JSON.stringify({ verdict: ok ? 'ADOPTED-AND-VERIFIED' : 'VERIFY-FAILED', tx: (res && res.id) || null, block: (res && res.block_num) || null, posting_now: p2 }));
            process.exit(ok ? 0 : 1);
          })().catch((e) => fail('UNEXPECTED', e.message));
          EOS
      - name: Always-report
        if: always()
        run: echo "owner-key-adopt finished"
