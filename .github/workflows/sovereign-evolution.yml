# sovereign-evolution — T10 perpetual learning loop (master plan)
# Daily self-examination: Actions throughput, economics, exposure regressions,
# content dedupe. Writes learning/evolution-<date>.json + ledger, commits,
# files an issue on SLO breach. Runs while the owner sleeps — GitHub only.
name: sovereign-evolution
on:
  # [W1.5 agent-zai] the header claims "Runs on schedule" but the trigger was
  # dispatch-only — measured: the learning loop went silent with every dead
  # sandbox session (learning/ ledger depended on mortal hands). 05:33 UTC daily
  # (odd-minute fleet cron hygiene); dispatch kept for operator use.
  schedule:
    - cron: "33 5 * * *"
  workflow_dispatch:
    inputs:
      strict:
        description: 'exit 1 on SLO breach'
        default: 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: sovereign-evolution
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Digest yesterday + SLO verdict
        id: digest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/evolution-digest.mjs --strict || true

      # ONE-VOICE LAW (2026-11-01): the filing step used to open a NEW issue per day
      # (measured: 18 open "evolution: SLO breach" issues #5-#32, 2026-10-15→11-01, one
      # unchanged P0-1 root) and never closed the recovered ones — an alarm that spawns
      # a duplicate every day and never forgives is notification noise, not an alarm.
      # Now: ONE rolling thread — comment on the oldest open issue on breach (newer
      # duplicates closed), close ALL open breach issues on a green digest.
      - name: One-voice SLO filing (comment-or-create on breach, close-all on green)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PREFIX='evolution: SLO breach'
          gh issue list --state open --limit 100 --json number,title,createdAt \
            > /tmp/all-open.json 2>/dev/null || echo "[]" > /tmp/all-open.json
          jq -c --arg p "$PREFIX" '[.[] | select(.title | startswith($p))] | sort_by(.createdAt)' \
            /tmp/all-open.json > /tmp/breach-issues.json 2>/dev/null || echo "[]" > /tmp/breach-issues.json
          COUNT=$(jq 'length' /tmp/breach-issues.json)

          if [ "${{ steps.digest.outcome }}" = "failure" ]; then
            echo "digest RED — one-voice filing ($COUNT open breach thread(s) found)"
            if [ "$COUNT" -eq 0 ]; then
              gh issue create --title "$PREFIX $(date -u +%F)" \
                --body "Daily digest found SLO breaches (run ${{ github.run_id }}). See learning/ ledger. One-voice law: this thread updates instead of spawning duplicates; it closes when a digest is green."
            else
              OLDEST=$(jq -r '.[0].number' /tmp/breach-issues.json)
              gh issue comment "$OLDEST" --body "Digest run ${{ github.run_id }} @ $(date -u +%FT%TZ): SLO breach persists (see learning/ ledger). One-voice: updating this thread instead of opening a new one."
              # close NEWER duplicates — the oldest thread stays canonical
              for N in $(jq -r '.[1:] | .[].number' /tmp/breach-issues.json); do
                gh issue close "$N" --reason "not planned" \
                  --comment "Duplicate breach thread — consolidated into #$OLDEST (one-voice law)."
              done
              echo "one-voice: updated #$OLDEST, closed $((COUNT-1)) duplicate(s)"
            fi
          else
            echo "digest GREEN (ALL-SLO-OK) — recovery law: closing all open breach threads ($COUNT)"
            if [ "$COUNT" -gt 0 ]; then
              for N in $(jq -r '.[].number' /tmp/breach-issues.json); do
                gh issue close "$N" --reason "completed" \
                  --comment "Recovered: digest ${{ github.run_id }} verdict=ALL-SLO-OK (P0-1 exposure probes clean). Closing under the one-voice law — the alarm only stays open while the breach is real."
              done
            fi
          fi

      - name: Commit learning artifacts
        if: always()
        run: |
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add learning 2>/dev/null || true
          git commit -m "evolution: daily digest $(date -u +%F) [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
