# SAOS RUNTIME — the sovereign heartbeat that outlives any sandbox (R244/R245, R280).
#
# WHY THIS REPO IS PUBLIC: public repositories get unlimited free Actions
# minutes; the private engine tree is cloned AT RUNTIME via the GH_PAT
# secret and never lands in this tree. This file is the only public
# artifact. No key material, no state, no account anything lives HERE
# (the role-scoped WIFs in repo secrets are chain-judged at adoption).
#
# WHAT ONE HEARTBEAT DOES (every cycle, fail-closed at every gate):
#   1. clone the PRIVATE engine tree (branch saos-cockpit + fetch main
#      — the git-vault credentials live on main) — blob-filtered partial
#      clone: full commit lineage for the chain-anchor probe, blobs on
#      demand (R280);
#   2. SELFTEST GATE — deterministic vectors; any failure = red run
#      (public alarm), nothing is broadcast;
#   3. CHAIN ANCHOR PROBE (R280, folded in from the private-repo
#      sovereign-cycle which is quota-dead by billing wall) — the latest
#      saos-git-custody-v1 anchor on the chain must sit in HEAD's lineage,
#      else the run goes red (drift alarm);
#   4. CI HEARTBEAT — the offline intelligence pack converses on-chain
#      with the soldier fleet (comments, replies, community, deepens,
#      mutual votes under hard caps and the R274/R275 clone guards);
#   5. DEX TAKEOVER (R245, operator order 2026-10-07 "no action is
#      sovereign on the sandbox"): when the sandbox's custodian anchor
#      goes STALE, this runner adopts the master's ACTIVE authority from
#      the CI_ADOPT_WIF_ACTIVE secret (chain-judged) and runs ONE full
#      engine cycle — trading, converts, the economy — until the sandbox
#      returns. A fresh anchor = STANDBY (never races the local engine);
#   6. state is committed back to the private tree (FF-only, no force).
#
# THE PULSE (R280): GitHub's scheduler degrades frequent crons to
# multi-hour gaps (measured 2026-10-08: 30-min cron ran every ~7.5h).
# So the heartbeat carries its own clock — after every run (success OR
# failure), a pulse job waits 15 minutes and dispatches the next
# heartbeat itself. Deterministic ~20-25 min cadence, independent of the
# scheduler. The hourly cron remains as a self-healing backstop: if the
# pulse chain ever dies, the backstop relaunches it. The network keeps
# its own time; no sandbox, no operator, no scheduler whims.
#
# THE SANDBOX-DISTRUST LAW, HONORED: this workflow is the proof that the
# organism lives on GitHub infrastructure — wipe the sandbox, the fleet
# keeps talking AND the market keeps trading.

name: sovereign-runtime

on:
  schedule:
    - cron: "23 * * * *"   # hourly backstop — revives the pulse chain if it ever dies
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sovereign-runtime
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R-VAULTPASS-1 (2026-10-11, zai-code-3): the GEN-1/ROT4 vault unlock
      # keys left the steem repo — the sealed bundle arrives as a secret.
      # Absent = honest UNLOCK-FAIL verdicts in state (never a crash).
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
    steps:
      # exec-20 measured: the heartbeat never checked out its OWN repo, so
      # ops/ resolvers (army-cache-resolve.cjs + the census probe it wraps)
      # were absent from the runner — the ignition step died "Cannot find
      # module .../ops/army-cache-resolve.cjs" (run 38197095126, 02:46Z).
      # The checkout is additive: the engine clone below is unchanged.
      - name: Checkout the public host (ops resolvers + workflow live here)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone the private engine tree (vault on main, engine on saos-cockpit)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --filter=blob:none --branch saos-cockpit "https://x-access-token:${GH_PAT}@github.com/roshpinacare-sys/steem.git" engine
          cd engine
          git config user.name "saos-runtime-ci"
          git config user.email "saos-runtime-ci@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main || echo "main fetch skipped (vault revival will report honestly)"
          echo "engine @ $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install engine deps
        working-directory: engine/mini-services/saos-engine
        run: npm i --no-save @noble/hashes@^1.5.0 @noble/secp256k1@^2.2.3 --silent

      - name: Selftest gate (fail-closed — red run = public alarm)
        working-directory: engine/mini-services/saos-engine
        run: node selftest.mjs
      # R-VAULTPASS-2 (exec-20 · owner=active): completes the loop R-VAULTPASS-1
      # left open — the passes left the repo into STEEM_VAULT_PASSES, but the
      # engine's own revival never consumed the secret (measured 02:12Z:
      # REVIVAL-FAIL 0/14 → post ENOENT → the grid stood down). This step runs
      # the census-PROVEN resolve path (receipt 01:56Z: GEN-2 bundle opens via
      # bundle.gen2.keysZipUnlock; 27 WIFs matched LIVE chain authorities) and
      # writes the engine cache in the exact schema the engine's own vault
      # writer uses. The beat then chain-judges EVERY WIF itself (adoptFromCache)
      # — the file is material, the chain is the only judge. Fail-soft by law:
      # an ignition failure never silences the beat; the engine's own honest
      # REVIVAL-FAIL remains the red signal.
      - name: Ignite army custody from the sealed GEN-2 bundle (R-VAULTPASS-2 · owner=active)
        working-directory: engine
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
        run: |
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          if NODE_PATH=/tmp/steemjs/node_modules node ../ops/army-cache-resolve.cjs --out .secrets/army-keys.json; then
            echo "IGNITED: army cache written (0600) — the beat will chain-judge every WIF"
          else
            echo "::warning::IGNITION-FAIL (honest) — the engine's own revival verdict carries the red; the beat is not silenced"
            echo "- ignition: FAIL (honest red — resolver output above)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Chain anchor probe (on-chain custody anchor must sit in HEAD lineage)
        working-directory: engine
        run: |
          node scripts/chain-anchor-probe.mjs || {
            echo "first probe failed — one retry (public nodes wobble)"
            sleep 10
            node scripts/chain-anchor-probe.mjs
          }

      # R315 FIX (2026-10-11, measured root cause of LIVE-REFUSED-NOT-ARMED
      # forever): the armed file MUST exist BEFORE the beat runs — the old step
      # order wrote it AFTER ci-cycle.mjs, and the tree is re-cloned every run,
      # so the post step could never see it. Arming first, beat second.
      - name: Arm the posting stream (T-61 · fail-closed when secret absent)
        working-directory: engine
        run: |
          mkdir -p .secrets
          if [ -n "$CI_SOCIAL_ARMED" ]; then
            printf '%s' "$CI_SOCIAL_ARMED" > .secrets/social-armed.json
            chmod 600 .secrets/social-armed.json
            echo "posting stream armed (standing order present)"
          else
            echo "CI_SOCIAL_ARMED secret absent — the stream stays fail-closed (LIVE-REFUSED-NOT-ARMED), by law"
          fi
        env:
          CI_SOCIAL_ARMED: ${{ secrets.CI_SOCIAL_ARMED }}

      - name: Beat env + posting arming (standing order travels as a repo secret)
        working-directory: engine/mini-services/saos-engine
        run: node ci-cycle.mjs
        env:
          SAOS_OFFLINE: "1"
          SAOS_CI_SKIP_MASTER: "1"
          CI_ADOPT_WIF_POSTING: ${{ secrets.CI_ADOPT_WIF_POSTING }}
          CI_ADOPT_WIF_ACTIVE: ${{ secrets.CI_ADOPT_WIF_ACTIVE }}
          CI_DELEGATION_ARMED: ${{ secrets.CI_DELEGATION_ARMED }}
          CI_SOCIAL_ARMED: ${{ secrets.CI_SOCIAL_ARMED }}

      # R316-Z · TRUTHRAIL OUTCOME GATE — measures the OUTCOME on the live
      # chain, not the machine. RED (fail run) only when the stream is armed
      # and starving: armed + zero fleet posts in 24h after a healthy RPC
      # round = the machine failed at its one job (the "green≠working"
      # disease). Closed-loop (0 outside votes) is WARN, never red: outside
      # votes depend on the world, not the machine. Writes
      # state/truthrail.json + merges truthrail* fields into
      # ci-last-heartbeat.json so the digest + summary inherit them.
      - name: TruthRail outcome gate (R316-Z · measure the outcome, not the machine)
        if: always()
        working-directory: engine
        run: node mini-services/saos-engine/truthrail-outcome.mjs

      - name: Hyper-grid burst (T-62 · git-native tick revival — bounded, governor-capped, fail-closed arming)
        working-directory: engine/mini-services/saos-engine
        run: |
          if [ -n "$CI_EXEC_ARMED" ]; then
            mkdir -p .secrets
            printf '%s' "$CI_EXEC_ARMED" > .secrets/exec-armed.json
            chmod 600 .secrets/exec-armed.json
            echo "exec standing order present — burst may execute ops (governor + opsDayCap enforce budgets)"
          else
            echo "CI_EXEC_ARMED absent — burst ticks honestly UNARMED (verdicts record why no ops ran), by law"
          fi
          # T-65 (zai-code-3) · secret-first grid arming: if the owner armed
          # STEEM_ACTIVE_WIF, chain-judge it and deliver it to the signer (0600).
          # Absent secret = the burst ticks honestly UNARMED (artery-grid law
          # law-grid-exec-alive holds the red until then). The heavy vault census
          # is NOT run here (measured-empty 2026-10-12) — heartbeat stays lean.
          if [ -n "$STEEM_ACTIVE_WIF" ]; then
            if [ ! -d /tmp/steemjs/node_modules/steem ]; then npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error; fi
            NODE_PATH=/tmp/steemjs/node_modules node "$GITHUB_WORKSPACE/ops/key-census-probe/probe-v2.cjs" --arm ../../.secrets/headcorner.key --arm-account headcorner --arm-role active --arm-chain steem --arm-secret || echo "arm soft-fail — burst continues honestly"
          else
            echo "STEEM_ACTIVE_WIF absent — grid ticks honestly UNARMED (owner one-action pending; law-grid-exec-alive holds the alarm)"
          fi
          HYPER_BURST_MS=90000 node hypergrid-burst.mjs
        env:
          CI_EXEC_ARMED: ${{ secrets.CI_EXEC_ARMED }}
          STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}

      # Z-20-e (exec-20 · owner=active): THE HIVE BEAT — the user's standing order
      # "תמצא פתרון להזרים את הhive" closed at the WORKFLOW layer (the engine's own
      # hive modules are untouched — T-65 territory): hiveCustody unlocks the vault
      # via vault-custody (STEEM_VAULT_PASSES is on the job env) and chain-judges
      # every WIF against the LIVE hive authorities; only then do the lanes run,
      # under the modules' OWN laws (caps, anti-herd, persona floor, RC floors,
      # fleet-pause veto). Fail-soft by law: any failure is an honest log line and
      # the beat carries on; state rides the existing state commit.
      - name: Hive beat (custody → rail + community loop · module laws internal)
        working-directory: engine/mini-services/saos-engine
        run: |
          node --input-type=module -e '
          const now = () => new Date().toISOString();
          try {
            const hive = await import("./hive.mjs");
            const c = await hive.hiveCustody({ now: now() });
            console.log("hive-custody:", c.verdict, "verified", c.verified ?? 0, "of", c.total ?? "?");
            if ((c.verified ?? 0) > 0) {
              try {
                const rail = await hive.runHiveRail({ now: now() });
                console.log("hive-rail:", rail && rail.verdict ? rail.verdict : "done");
              } catch (e) { console.log("hive-rail failed (honest):", String(e && e.message || e).slice(0, 140)); }
              try {
                const hs = await import("./hive-social.mjs");
                const s = await hs.runHiveSocial({ now: now() });
                console.log("hive-social:", s && s.verdict ? s.verdict : "done");
              } catch (e) { console.log("hive-social failed (honest):", String(e && e.message || e).slice(0, 140)); }
            } else {
              console.log("hive lanes skipped — no chain-verified hive custody (fail-closed, honest)");
            }
          } catch (e) {
            console.log("hive beat failed (honest, fail-soft):", String(e && e.message || e).slice(0, 160));
          }
          '
      - name: Commit state back (FF-only, no force, ever · honest yield to the alive custodian — T-58 fix)
        working-directory: engine
        run: |
          git add -A mini-services/saos-engine/state mini-services/saos-engine/content/sent
          if git diff --cached --quiet; then
            echo "no state changes this heartbeat"
          else
            git commit -m "SAOS-runtime-ci: heartbeat state (offline conversation + content) [ci]"
            ok=0; yielded=0
            for i in 1 2 3 4 5; do
              if git push origin saos-cockpit; then ok=1; break; fi
              echo "push raced with the sandbox custodian — fetch + rebase, retry $i"
              git status --porcelain | head -10 || true
              git stash push --include-untracked -m "runner residual between heartbeats (state already committed)" || true
              git fetch origin saos-cockpit
              if git rebase origin/saos-cockpit; then
                sleep $((i * 5))
                continue
              fi
              # rebase failed: a real conflict (rebase in progress) OR a
              # refusal to start ("cannot rebase: unstaged changes" — a stash
              # failure left residuals). Both mean the branch-of-record moved
              # under this heartbeat: yield honestly either way. The abort is
              # guarded — a bare `git rebase --abort` with no rebase in
              # progress exits 128 and would kill the step (measured 15:34Z
              # run 38151872541: exactly that, on top of the conflict itself).
              if git rebase --abort 2>/dev/null; then
                echo "rebase CONFLICT on machine-generated state (events/exec/custody snapshots) — measured T-58 root cause: the always-on custodian engine rewrote the same state files while this heartbeat ran."
                echo "A conflict is PROOF the custodian is alive and writing. The custodian is the branch-of-record: this runner's state commit yields honestly. No force, ever. Custodian keeps the record."
              else
                echo "rebase refused to start (unstaged residuals survived the stash) — yielding honestly too: the state commit stays local, the custodian branch-of-record is untouched, no force."
              fi
              yielded=1
              break
            done
            if [ "$ok" != "1" ] && [ "$yielded" != "1" ]; then
              echo "state push-back failed after 5 retries with NO conflict — unexpected; fail-closed"
              exit 1
            fi
          fi

      - name: Summary (verdicts only — this page is public)
        if: always()
        working-directory: engine/mini-services/saos-engine
        run: |
          {
            echo "## SAOS sovereign heartbeat"
            echo ""
            echo "- time: $(date -u +%FT%TZ)"
            if [ -f state/ci-last-heartbeat.json ]; then
              node -e 'const d=require("./state/ci-last-heartbeat.json");console.log("- custody: "+d.custody);console.log("- social: "+d.social+" (executed "+d.socialExecuted+")");console.log("- content: "+d.content+" (source "+d.contentSource+")");console.log("- digest: "+(d.digest ?? "n/a")+" ("+(d.digestTitle ?? "n/a")+")");console.log("- post: "+d.post+" ("+(d.postAccount ?? "n/a")+")");console.log("- blurt: "+(d.blurt ?? "n/a")+" (live "+(d.blurtLive ?? "?")+")");console.log("- delegation: "+(d.delegation ?? "n/a")+" (ops "+(d.delegationOps ?? 0)+", "+(d.delegationSp ?? 0)+" SP)");console.log("- dex: "+d.dex+" ("+(d.dexReason ?? "n/a")+")");console.log("- truthrail: "+(d.truthrail ?? "n/a")+" (posts24h "+(d.truthrailPosts24h ?? "?")+", outside "+(d.truthrailOutsideVotes ?? "?")+")");'
            else
              echo "- heartbeat state file missing (a step failed — see logs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Operator digest issue (once per UTC day, fail-soft)
        if: always()
        working-directory: engine/mini-services/saos-engine
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const day = new Date().toISOString().slice(0, 10);
          const title = `SAOS daily digest ${day}`;
          const H = { "Authorization": `token ${process.env.GH_PAT}`, "Accept": "application/vnd.github+json" };
          (async () => {
            try {
              const q = await fetch("https://api.github.com/repos/roshpinacare-sys/steem/issues?state=all&per_page=100", { headers: H });
              const s = await q.json();
              const alreadyIssued = Array.isArray(s) && s.some((it) => it && typeof it.title === "string" && it.title === title && !it.pull_request);
              if (alreadyIssued) { console.log("digest already issued for", day); return; }
              let hb = {};
              try { hb = JSON.parse(fs.readFileSync("state/ci-last-heartbeat.json", "utf8")); } catch {}
              const lines = [
                "## SAOS daily truth (measured, not promised)",
                "",
                `- custody: ${hb.custody ?? "?"}`,
                `- social: ${hb.social ?? "?"} (executed ${hb.socialExecuted ?? 0})`,
                `- content: ${hb.content ?? "?"} (source ${hb.contentSource ?? "?"})`,
                `- digest: ${hb.digest ?? "?"} (${hb.digestTitle ?? "no title"})`,
                `- post: ${hb.post ?? "?"} (${hb.postAccount ?? "n/a"})`,
                `- blurt: ${hb.blurt ?? "?"} (live ${hb.blurtLive ?? "?"})`,
                `- delegation: ${hb.delegation ?? "?"} (ops ${hb.delegationOps ?? 0}, ${hb.delegationSp ?? 0} SP)`,
                `- dex: ${hb.dex ?? "?"} (${hb.dexReason ?? "n/a"})`,
                `- truthrail: ${hb.truthrail ?? "?"} (posts24h ${hb.truthrailPosts24h ?? "?"}, outside votes ${hb.truthrailOutsideVotes ?? "?"})`,
                "",
                "## Open operator decisions (P0 first)",
                "",
                "1. **P0 SECURITY (owner-only)**: rotate the GitHub PAT and rotate chain keys. Verified 2026-10-11: the vault wrap derives its key as sha256(PAT) (vaultlib.sh:9) and legacy seals use the credential itself — anyone holding the PAT can open the vault. The PAT has passed through at least two agent sandboxes.",
                "2. **Blurt spend**: the R254 operator pause stands. Bodies are now visible every beat (R313, read-only); spend needs an explicit re-arm order.",
                "3. **Delegation (R314, armed)**: floors 100 SP publishers / 20 SP soldiers, run cap 1200 SP, treasury keep 2800 SP, reversible 7-day, ledgered in state/delegation-ledger.jsonl.",
                "",
                "_Automated operator digest — once per day, fail-soft. Evidence: engine state files committed in this repo._",
              ];
              const r = await fetch("https://api.github.com/repos/roshpinacare-sys/steem/issues", {
                method: "POST", headers: { ...H, "content-type": "application/json" },
                body: JSON.stringify({ title, body: lines.join("\n") }),
              });
              console.log("digest issue:", r.status);
            } catch (e) { console.log("digest issue failed (fail-soft):", String(e).slice(0, 120)); }
          })();
          EOF

  pulse:
    needs: heartbeat
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Fleet relay — guarded dispatch to closer + decider + THE GRID + evolution (T-65 grid-never-down, fail-soft)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          relay() {
            local repo="$1" wf="$2" minAge="${3:-15}" last age code
            last=$(curl -s -H "Authorization: token ${GH_PAT}" "https://api.github.com/repos/roshpinacare-sys/${repo}/actions/workflows/${wf}/runs?per_page=1" | jq -r '.workflow_runs[0].created_at // empty')
            if [ -n "$last" ]; then
              age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
              if [ "$age" -lt "$minAge" ]; then echo "RELAY[${repo}/${wf}]: SKIPPED (ran ${age}min ago < ${minAge} — no-noise)"; return; fi
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: token ${GH_PAT}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/roshpinacare-sys/${repo}/actions/workflows/${wf}/dispatches" -d '{"ref":"main"}')
            echo "RELAY[${repo}/${wf}]: dispatch http:${code} (fail-soft — the pulse chain never depends on the relay)"
          }
          relay "FleetHQ" "opens-closer.yml"
          relay "FleetHQ" "sovereign-decider.yml"
          relay "saos-runtime" "fee-engine.yml" 245
          relay "saos-runtime" "sovereign-evolution.yml" 1500

      - name: Deterministic pulse — self-reschedule the next heartbeat
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 900
          code=$(curl -s -o /tmp/dispatch.out -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/roshpinacare-sys/saos-runtime/actions/workflows/sovereign-runtime.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch http:$code"
          [ "$code" = "204" ] || { cat /tmp/dispatch.out; exit 1; }

