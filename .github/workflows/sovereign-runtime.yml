                * Aborted runs 38283505555 ("missing headcorner") + 38297860040
                * ("missing acct-00"): decrypt SUCCEEDED both times — only this gate
                * stood between the live army keys and the cache. When the head IS
                * carried, the 47e0ee45 role law still applies (active demanded). */
              const headEntry = byAccount.get(P.ref2name("acct-00")) || null;
              const headCarried = Boolean(headEntry && (headEntry.wif || headEntry.activeWif));
              const missing = roster.filter((name) => {
                const e = byAccount.get(name) || {};
                if (name === P.ref2name("acct-00")) return headCarried ? !e.activeWif : false;
                return !e.wif;
              });
              /* R327-c GENERATION LADDER (chain-judged, per-account): a newer seal can carry
               * an UNREGISTERED key for an account whose live key lives in the PREVIOUS seal
               * (measured 2026-10-14: siq's live posting = the 21:34:33Z broadcast, sealed in
               * KEYS-ROT2-2026-10-12.zip.enc on the custody branch; the 00:05Z re-seal
               * (KEYS-ROT2-2026-10-13, run #14) overwrote the roster gate with the failed-
               * broadcast material — GEN-2-REFUSED:posting-authority-mismatch ever since).
               * The R255 law — "the vault re-pulls until the chain says yes" — applied ACROSS
               * bundles: for every still-missing roster account, open the other sealed bundles
