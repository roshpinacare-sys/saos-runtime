            echo "- ignition: FAIL (honest red — resolver output above)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # R327 ROT2 CUSTODY RAIL — the vault of record can lag the chain (measured root,
      # 2026-10-14: siq/acct-06 posting rotated ON-CHAIN at 20:17/20:45/21:34Z on 10-12
      # — final STM6ucW9GYSy… op#4553 — while both vault generations predate it; the
      # engine chain-judges honestly and refuses, custody sat 13/14, GRID red, social
      # lanes braked). The rotation vault (ROT2_FLEET_KEYS, sealed by custody-recover
      # 2-a and auto-decrypted by Actions into this env) holds the rotation-era
      # material. This rail chain-judges EVERY ROT2 WIF itself (steem.auth.wifToPublic
      # vs LIVE chain authority — the chain is the only judge, twice: here and again in
      # the beat's adoptFromCache) and appends LIVE-MATCH material as a "ROT2" generation
      # into the engine cache — the exact schema mirror, atomic 0600. Gen order keeps
      # GEN-2 first; adoption picks the first chain-verified gen, so a stale GEN-2 can
      # never mask a live ROT2 gen for the same account. Fail-soft by law: absent
      # secret/cache/unresolvable refs are honest no-ops — the beat's own verdicts
      # carry the reds; this rail only ever ADDS chain-verified material. Fingerprints
      # only in output — never WIFs, never pubkeys beyond the 12-char fp class.
      - name: ROT2 custody rail (chain-judged adoption for accounts the git vault can't serve)
        working-directory: engine
        env:
          ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: |
          mkdir -p /tmp/ignite
          cat > /tmp/ignite/rot2-rail.cjs <<'RAIL_EOF'
          /* R327 ROT2 custody rail — chain-judged adoption for accounts the git vault can't serve.
           * CJS + NODE_PATH (the ignite resolver's own convention): require("steem") resolves
           * from /tmp/steemjs/node_modules installed by the ignition step. */
          const fs = require("node:fs");
          const ENV = process.env.ROT2_FLEET_KEYS || "";
          const say = (m) => console.log("ROT2-RAIL: " + m);
