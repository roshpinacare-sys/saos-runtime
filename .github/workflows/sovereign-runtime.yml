            try { rot2 = JSON.parse(ENV); } catch (e) { console.log("::warning::ROT2-RAIL: secret unparseable — honest no-op (" + String(e && e.message || e).slice(0, 80) + ")"); return; }
            const steemMap = (rot2 && (rot2.rot2?.steem || rot2.steem)) || null;
