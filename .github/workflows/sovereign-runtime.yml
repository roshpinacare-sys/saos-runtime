              raw = open(src, "rb").read()
          except Exception as e:
              warn("verdict file unreadable: %s" % str(e)[:120])
              raise SystemExit(0)
          # verdicts-only law (same as the 23-f last-mile): never publish key material
          if re.search(rb"[1-9A-HJ-NP-Za-km-z]{50}", raw) or re.search(rb"[0-9a-fA-F]{40}", raw) or b"ghp_" in raw or b"github_pat_" in raw:
              warn("verdict carries key-material pattern — refusing to publish (verdicts-only by design)")
              raise SystemExit(0)
          try:
              at = json.loads(raw.decode("utf-8")).get("at")
              assert isinstance(at, str) and "T" in at
          except Exception as e:
              warn("verdict unparseable (no at) — refusing to publish: %s" % str(e)[:120])
              raise SystemExit(0)
          # freshness gate: publish only a verdict NEWER than what the origin tip
          # already had at clone time — a beat that produced nothing (or a run
          # that failed before the beat) leaves the inherited clone copy in
          # place, which must NOT be republished as canonical.
          sha = None
          canon_at = ""
          try:
              rq = urllib.request.Request(API + "?ref=main")
              rq.add_header("Authorization", "token " + tok)
              rq.add_header("Accept", "application/vnd.github+json")
              with urllib.request.urlopen(rq, timeout=30) as resp:
                  meta = json.load(resp)
              sha = meta.get("sha")
              branch_b = base64.b64decode(meta.get("content") or "")
              try:
                  canon_at = json.loads(branch_b.decode("utf-8")).get("at") or ""
              except Exception:
                  canon_at = ""
              if branch_b == raw:  # 26-b byte-identity guard: never commit a frozen verdict twice
                  log("canonical blob byte-identical (at=%s) — nothing to commit" % at)
                  raise SystemExit(0)
          except urllib.error.HTTPError as ge:
              if ge.code != 404:
                  warn("canonical GET failed (http=%d) — fail-soft skip" % ge.code)
                  raise SystemExit(0)
          except Exception as e:
              warn("canonical GET failed: %s — fail-soft skip" % str(e)[:120])
              raise SystemExit(0)
          # 26-b gate v2: freshness baseline = the canonical home itself, NOT the
          # engine origin tip (this very beat updates that tip before this step
          # runs, so gate v1 compared the verdict against itself and always skipped).
          if canon_at and at <= canon_at:
              log("canonical already at=%s (verdict at=%s) — nothing newer to publish (honest)" % (canon_at, at))
              raise SystemExit(0)
          body = {"message": "beat verdict: canonical home (custodian-free) %s" % at,
                  "content": base64.b64encode(raw).decode(), "branch": "main"}
          if sha:
              body["sha"] = sha
          try:
              pq = urllib.request.Request(API, data=json.dumps(body).encode(), method="PUT")
              pq.add_header("Authorization", "token " + tok)
              pq.add_header("Accept", "application/vnd.github+json")
              with urllib.request.urlopen(pq, timeout=30) as resp:
                  out = json.load(resp)
              log("canonical verdict committed (at=%s, commit %s)" % (at, str(out.get("commit", {}).get("sha", ""))[:12]))
          except Exception as e:
              warn("canonical PUT failed: %s — steem mirror and the rest of the beat continue" % str(e)[:160])
          PY26B
          python3 /tmp/canonical-verdict-26b.py || echo "::warning::26-b canonical verdict step errored — fail-soft, beat continues"

      - name: Summary (verdicts only — this page is public)
        if: always()
        working-directory: engine/mini-services/saos-engine
        run: |
          {
            echo "## SAOS sovereign heartbeat"
            echo ""
            echo "- time: $(date -u +%FT%TZ)"
            if [ -f state/ci-last-heartbeat.json ]; then
              node -e 'const d=require("./state/ci-last-heartbeat.json");console.log("- custody: "+d.custody);console.log("- social: "+d.social+" (executed "+d.socialExecuted+")");console.log("- content: "+d.content+" (source "+d.contentSource+")");console.log("- digest: "+(d.digest ?? "n/a")+" ("+(d.digestTitle ?? "n/a")+")");console.log("- post: "+d.post+" ("+(d.postAccount ?? "n/a")+")");console.log("- blurt: "+(d.blurt ?? "n/a")+" (live "+(d.blurtLive ?? "?")+")");console.log("- delegation: "+(d.delegation ?? "n/a")+" (ops "+(d.delegationOps ?? 0)+", "+(d.delegationSp ?? 0)+" SP)");console.log("- dex: "+d.dex+" ("+(d.dexReason ?? "n/a")+")");console.log("- truthrail: "+(d.truthrail ?? "n/a")+" (posts24h "+(d.truthrailPosts24h ?? "?")+", outside "+(d.truthrailOutsideVotes ?? "?")+")");'
            else
              echo "- heartbeat state file missing (a step failed — see logs)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Operator digest issue (once per UTC day, fail-soft)
        if: always()
        working-directory: engine/mini-services/saos-engine
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node - <<'EOF'
          const fs = require("node:fs");
          const day = new Date().toISOString().slice(0, 10);
          const title = `SAOS daily digest ${day}`;
          const H = { "Authorization": `token ${process.env.GH_PAT}`, "Accept": "application/vnd.github+json" };
          (async () => {
            try {
              const q = await fetch("https://api.github.com/repos/roshpinacare-sys/steem/issues?state=all&per_page=100", { headers: H });
              const s = await q.json();
              const alreadyIssued = Array.isArray(s) && s.some((it) => it && typeof it.title === "string" && it.title === title && !it.pull_request);
              if (alreadyIssued) { console.log("digest already issued for", day); return; }
              let hb = {};
              try { hb = JSON.parse(fs.readFileSync("state/ci-last-heartbeat.json", "utf8")); } catch {}
              const lines = [
                "## SAOS daily truth (measured, not promised)",
                "",
                `- custody: ${hb.custody ?? "?"}`,
                `- social: ${hb.social ?? "?"} (executed ${hb.socialExecuted ?? 0})`,
                `- content: ${hb.content ?? "?"} (source ${hb.contentSource ?? "?"})`,
                `- digest: ${hb.digest ?? "?"} (${hb.digestTitle ?? "no title"})`,
                `- post: ${hb.post ?? "?"} (${hb.postAccount ?? "n/a"})`,
                `- blurt: ${hb.blurt ?? "?"} (live ${hb.blurtLive ?? "?"})`,
                `- delegation: ${hb.delegation ?? "?"} (ops ${hb.delegationOps ?? 0}, ${hb.delegationSp ?? 0} SP)`,
                `- dex: ${hb.dex ?? "?"} (${hb.dexReason ?? "n/a"})`,
                `- truthrail: ${hb.truthrail ?? "?"} (posts24h ${hb.truthrailPosts24h ?? "?"}, outside votes ${hb.truthrailOutsideVotes ?? "?"})`,
                "",
                "## Open operator decisions (P0 first)",
                "",
                "1. **P0 SECURITY (owner-only)**: rotate the GitHub PAT and rotate chain keys. Verified 2026-10-11: the vault wrap derives its key as sha256(PAT) (vaultlib.sh:9) and legacy seals use the credential itself — anyone holding the PAT can open the vault. The PAT has passed through at least two agent sandboxes.",
                "2. **Blurt spend**: the R254 operator pause stands. Bodies are now visible every beat (R313, read-only); spend needs an explicit re-arm order.",
                "3. **Delegation (R314, armed)**: floors 100 SP publishers / 20 SP soldiers, run cap 1200 SP, treasury keep 2800 SP, reversible 7-day, ledgered in state/delegation-ledger.jsonl.",
                "",
                "_Automated operator digest — once per day, fail-soft. Evidence: engine state files committed in this repo._",
              ];
              const r = await fetch("https://api.github.com/repos/roshpinacare-sys/steem/issues", {
                method: "POST", headers: { ...H, "content-type": "application/json" },
                body: JSON.stringify({ title, body: lines.join("\n") }),
              });
              console.log("digest issue:", r.status);
            } catch (e) { console.log("digest issue failed (fail-soft):", String(e).slice(0, 120)); }
          })();
          EOF

  pulse:
    needs: heartbeat
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Fleet relay — guarded dispatch to closer + decider + THE GRID + evolution (T-65 grid-never-down, fail-soft)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          relay() {
            local repo="$1" wf="$2" minAge="${3:-15}" last age code
            last=$(curl -s -H "Authorization: token ${GH_PAT}" "https://api.github.com/repos/roshpinacare-sys/${repo}/actions/workflows/${wf}/runs?per_page=1" | jq -r '.workflow_runs[0].created_at // empty')
            if [ -n "$last" ]; then
              age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
              if [ "$age" -lt "$minAge" ]; then echo "RELAY[${repo}/${wf}]: SKIPPED (ran ${age}min ago < ${minAge} — no-noise)"; return; fi
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: token ${GH_PAT}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/roshpinacare-sys/${repo}/actions/workflows/${wf}/dispatches" -d '{"ref":"main"}')
            echo "RELAY[${repo}/${wf}]: dispatch http:${code} (fail-soft — the pulse chain never depends on the relay)"
          }
          relay "FleetHQ" "opens-closer.yml"
          relay "FleetHQ" "sovereign-decider.yml"
          relay "saos-runtime" "fee-engine.yml" 245
          relay "saos-runtime" "sovereign-evolution.yml" 1500

      - name: Watchdog tick — dispatch grid-watchdog when due
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          WD_GH_TOKEN: ${{ github.token }}
        run: |
          DUE=$(curl -s -m 15 -H "Authorization: token ${WD_GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/roshpinacare-sys/saos-runtime/contents/state/grid-status.json?ref=main" | python3 -c '
          import sys, json, base64
          from datetime import datetime, timezone
          try:
              d = json.load(sys.stdin)
              st = json.loads(base64.b64decode(d["content"]).decode())
              gen = datetime.strptime(st.get("generatedAt", ""), "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              age = (datetime.now(timezone.utc) - gen).total_seconds()
              reds = st.get("reds", [])
              n = len(reds) if isinstance(reds, list) else 0
              full = 1800 if (n > 0 or age > 7200) else 7200
              print("DUE" if age >= full else "NOTDUE")
          except Exception:
              print("DUE")
          ') || DUE=DUE
          if [ "$DUE" != "DUE" ]; then echo "watchdog tick: grid-watchdog not due — skip (fail-soft)"; exit 0; fi
          code=$(curl -s -m 15 -o /tmp/wdtick.out -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_PAT}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/roshpinacare-sys/saos-runtime/actions/workflows/grid-watchdog.yml/dispatches" \
            -d '{"ref":"main"}') || code=000
          echo "watchdog tick: dispatch grid-watchdog http:${code} (fail-soft — never slows the beat)"
          [ "$code" = "204" ] || echo "watchdog dispatch skipped (non-fatal)"

      - name: Deterministic pulse — self-reschedule the next heartbeat
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 900
          # T-22c hardening (grid-never-down): one transient dispatch failure must not kill
          # the pulse chain — 3 attempts with backoff before the beat reports dead. The hourly
          # cron backstop remains the final revive for infra/billing deaths where NOTHING runs.
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/dispatch.out -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/roshpinacare-sys/saos-runtime/actions/workflows/sovereign-runtime.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "dispatch attempt $i http:$code"
            [ "$code" = "204" ] && break
            sleep 30
          done
          [ "$code" = "204" ] || { cat /tmp/dispatch.out; exit 1; }

