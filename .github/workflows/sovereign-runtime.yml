                 * is written with the resolved accounts only, every WIF in it stays
                 * chain-verified (the chain is the only judge), absent accounts remain
                 * honestly REFUSED-NO-CUSTODY in the engine state, and the missing refs
                 * stay LOUD here until the FLEET_ROSTER_MAP secret is repaired. */
                console.error(`army-cache-resolve: roster incomplete — missing ${missing.map((n) => P.name2ref(n)).join(", ")} — PARTIAL IGNITE (chain-verified ${roster.length - missing.length}/${roster.length}); missing refs stay loud until the map is repaired`);
              }

              /* exact mirror of pullArmyKeysFromVault()'s cache schema: accounts sorted,
               * one GEN-2 generation entry per account, gens carry wif/pub/activeWif/activePub. */
              /* 23-d schema mirror: pullArmyKeysFromVault() admits ONLY accounts that
                * carry material (gens filtered on wif; no-material names land in its
                * missing list) — a no-material head entry in the cache would send the
                * engine's narrow adoption rail (adoptAccountPostingWif) into a re-pull
                * that CLOBBERS the army-era cache with stale branch-era keys
