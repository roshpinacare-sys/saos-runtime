# SAOS RUNTIME — the sovereign heartbeat that outlives any sandbox (R244/R245, R280).
#
# WHY THIS REPO IS PUBLIC: public repositories get unlimited free Actions
# minutes; the private engine tree is cloned AT RUNTIME via the GH_PAT
# secret and never lands in this tree. This file is the only public
# artifact. No key material, no state, no account anything lives HERE
# (the role-scoped WIFs in repo secrets are chain-judged at adoption).
#
# WHAT ONE HEARTBEAT DOES (every cycle, fail-closed at every gate):
#   1. clone the PRIVATE engine tree (branch saos-cockpit + fetch main
#      — the git-vault credentials live on main) — blob-filtered partial
#      clone: full commit lineage for the chain-anchor probe, blobs on
#      demand (R280);
#   2. SELFTEST GATE — deterministic vectors; any failure = red run
#      (public alarm), nothing is broadcast;
#   3. CHAIN ANCHOR PROBE (R280, folded in from the private-repo
#      sovereign-cycle which is quota-dead by billing wall) — the latest
#      saos-git-custody-v1 anchor on the chain must sit in HEAD's lineage,
#      else the run goes red (drift alarm);
#   4. CI HEARTBEAT — the offline intelligence pack converses on-chain
#      with the soldier fleet (comments, replies, community, deepens,
#      mutual votes under hard caps and the R274/R275 clone guards);
#   5. DEX TAKEOVER (R245, operator order 2026-10-07 "no action is
#      sovereign on the sandbox"): when the sandbox's custodian anchor
#      goes STALE, this runner adopts the master's ACTIVE authority from
#      the CI_ADOPT_WIF_ACTIVE secret (chain-judged) and runs ONE full
#      engine cycle — trading, converts, the economy — until the sandbox
#      returns. A fresh anchor = STANDBY (never races the local engine);
#   6. state is committed back to the private tree (FF-only, no force).
#   7. (26-b) the fresh CI-HEARTBEAT verdict is ALSO committed to THIS repo —
#      state/beat/ci-last-heartbeat.json on main — its custodian-free canonical
#      home. The steem copy stays a best-effort mirror: a resident operator-side
#      custodian overwrites/rewinds it (measured R321 b96103e9 11:26:46Z froze
#      at=10:08:07.706Z over fresher CI verdicts); THIS repo never sees that
#      writer (last 30 commits: CI identities only). Byte-guarded, FF-only
#      Contents-API PUT, fail-soft (a failure here never fails the beat).
#
# THE PULSE (R280): GitHub's scheduler degrades frequent crons to
# multi-hour gaps (measured 2026-10-08: 30-min cron ran every ~7.5h).
# So the heartbeat carries its own clock — after every run (success OR
# failure), a pulse job waits 15 minutes and dispatches the next
# heartbeat itself. Deterministic ~20-25 min cadence, independent of the
# scheduler. The hourly cron remains as a self-healing backstop: if the
# pulse chain ever dies, the backstop relaunches it. The network keeps
# its own time; no sandbox, no operator, no scheduler whims.
#
# THE SANDBOX-DISTRUST LAW, HONORED: this workflow is the proof that the
# organism lives on GitHub infrastructure — wipe the sandbox, the fleet
# keeps talking AND the market keeps trading.

name: sovereign-runtime

on:
  schedule:
    - cron: "23 * * * *"   # hourly backstop — revives the pulse chain if it ever dies
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # R324 pulse-hardening: the hourly cron backstop no longer queues behind (and
  # gets cancelled against) the 15-min self-dispatch pulse chain. The pulse owns
  # its group; the backstop owns a separate one — two independent revivers.
  group: ${{ github.event_name == 'schedule' && 'sovereign-runtime-backstop' || 'sovereign-runtime' }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # R-VAULTPASS-1 (2026-10-11, zai-code-3): the GEN-1/ROT4 vault unlock
      # keys left the steem repo — the sealed bundle arrives as a secret.
      # Absent = honest UNLOCK-FAIL verdicts in state (never a crash).
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
    steps:
      # exec-20 measured: the heartbeat never checked out its OWN repo, so
      # ops/ resolvers (army-cache-resolve.cjs + the census probe it wraps)
      # were absent from the runner — the ignition step died "Cannot find
      # module .../ops/army-cache-resolve.cjs" (run 38197095126, 02:46Z).
      # The checkout is additive: the engine clone below is unchanged.
      - name: Checkout the public host (ops resolvers + workflow live here)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Clone the private engine tree (vault on main, engine on saos-cockpit)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --filter=blob:none --branch saos-cockpit "https://x-access-token:${GH_PAT}@github.com/roshpinacare-sys/steem.git" engine
          cd engine
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main || echo "main fetch skipped (vault revival will report honestly)"
          echo "engine @ $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install engine deps
        working-directory: engine/mini-services/saos-engine
        run: npm i --no-save @noble/hashes@^1.5.0 @noble/secp256k1@^2.2.3 --silent

      - name: Selftest gate (fail-closed — red run = public alarm)
        working-directory: engine/mini-services/saos-engine
        run: node selftest.mjs
      # R-VAULTPASS-2 (exec-20 · owner=active): completes the loop R-VAULTPASS-1
      # left open — the passes left the repo into STEEM_VAULT_PASSES, but the
      # engine's own revival never consumed the secret (measured 02:12Z:
      # REVIVAL-FAIL 0/14 → post ENOENT → the grid stood down). This step runs
      # the census-PROVEN resolve path (receipt 01:56Z: GEN-2 bundle opens via
      # bundle.gen2.keysZipUnlock; 27 WIFs matched LIVE chain authorities) and
      # writes the engine cache in the exact schema the engine's own vault
      # writer uses. The beat then chain-judges EVERY WIF itself (adoptFromCache)
      # — the file is material, the chain is the only judge. Fail-soft by law:
      # an ignition failure never silences the beat; the engine's own honest
      # REVIVAL-FAIL remains the red signal.
      - name: Ignite army custody from the sealed GEN-2 bundle (R-VAULTPASS-2 · owner=active)
        working-directory: engine
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
        run: |
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          # T-66b (2026-10-12T15:00Z) removed ops/army-cache-resolve.cjs + ops/key-census-probe/probe.cjs
          # from the public tree (PUBLISH-POLICY §3) — which silently severed the exec-20 R-VAULTPASS-2
          # ignition path (module-absent = run 38197095126 failure mode). Grid-never-down law wins:
          # the resolver + probe now travel VERBATIM inside the workflow, so no tree cleanup can sever
          # the custody path again. Long-term home (rotation lane follow-up): the private engine tree.
          mkdir -p /tmp/ignite/key-census-probe
          cat > /tmp/ignite/key-census-probe/probe.cjs <<'PROBE_EOF'
          // KEY-CENSUS-PROBE — verify-only: does the machine ALREADY hold a key that derives a live authority?
          // ════════════════════════════════════════════════════════════════════════════════════════════════════
          // Owner mandate trace 1a12…ff11 (2026-10-12): [owner-directive].
          //
          // רקע מדוד: gate-01 (G1) אומר "עדכן-סוד" — אבל census ה-Domain (2026-10-11 23:08Z) מדד שאף-מועמד
          // בכספת-Domain לא גוזר את רשות-ה-active החיה של acct-00 (ref · שכבת-ה-pseudonym, גל-19). לפני ששואלים-את-הבעלים שוב — מודדים
          // מה-המכונה-כבר-מחזיקה: כרוך-ה-custody של GEN-2 (steem/agent/vault/KEYS-ZIP-GEN2-*.zip.enc) נפתח
          // ב-STEEM_VAULT_PASSES — סוד שהריפו-הזה מחזיק. ה-payload הפנימי = מערכת-המפתחות של הצי.
          //
          // החוק (fail-safe בכל-שכבה):
          //   1. verify-only — אפס שידור, אפס כתיבת-סודות, אפס שינוי-רשויות. המדידה היא התוצר.
          //   2. אפס חומר-פרטי בלוג/קבלה: סיסמאות עוברות env-only ולעולם לא מודפסות; WIF-ים לעולם לא
          //      מודפסים — רק המפתח-הציבורי-הנגזר (מידע-ציבורי ממילא — הוא על-השרשרת).
          //   3. cleanup — /tmp נמחק בסוף-כל-נתיב (כולל קלטת-חריגה).
          //   4. כנות — DECRYPT-FAILED / NO-MATCH הם תוצאות-לגיטימיות-מפורסמות, לא כישלונות-צינור.
          //
          // שימוש: NODE_PATH=<steem-lib> node ops/key-census-probe/probe.cjs [--selftest] [--receipt path]
          'use strict';
          const { execFileSync } = require("child_process");
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const steem = require("steem");

          // refs layer (estate-pseudonym law, wave 19): the roster travels as REFS only.
          // Real chain names are resolved from FLEET_ROSTER_MAP (repo secret) — nested
          // {refs:{ref:name}} / {names:{name:ref}} / flat shapes accepted. Unresolved =
          // honest abort (verify-only has nothing to classify; NEVER fabricate a name).
          const REFS_ENV = (() => { try { const m = JSON.parse(process.env.FLEET_ROSTER_MAP || ""); const f = {}; if (m && m.refs) Object.assign(f, m.refs); if (m && m.names) Object.assign(f, m.names); for (const [k, v] of Object.entries(m || {})) if (typeof v === "string") f[k] = v; const r2n = {}, n2r = {}; for (const [k, v] of Object.entries(f)) { if (typeof k !== "string" || typeof v !== "string") continue; if (k.startsWith("acct-")) { r2n[k] = v; n2r[v] = k; } else { n2r[k] = v; r2n[v] = k; } } return { r2n, n2r }; } catch { return { r2n: {}, n2r: {} }; } })();
          const ref2name = (r) => REFS_ENV.r2n[r] || null;
          const name2ref = (n) => REFS_ENV.n2r[n] || String(n || "");

          const WIF_RE = /^[5JK][1-9A-HJ-NP-Za-km-z]{50}$/;
          const ROSTER_REFS = [
            "acct-00", "acct-01", "acct-02", "acct-03", "acct-04", "acct-05", "acct-06",
            "acct-07", "acct-08", "acct-09", "acct-10", "acct-11", "acct-12", "acct-13",
          ];
          const ROSTER = ROSTER_REFS.map(ref2name);
          const ROSTER_UNRESOLVED = ROSTER.some((n) => !n);
          const STEEM_NODES = ["https://api.steemit.com", "https://api.justyy.com", "https://steem-rpc.publicnode.com"];

          async function rpcAny(method, params) {
            const errs = [];
            for (const node of STEEM_NODES) {
              try {
                const r = await fetch(node, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ jsonrpc: "2.0", method, params, id: 1 }),
                });
                const j = await r.json();
                if (j.result !== undefined) return j.result;
                errs.push(`${new URL(node).host}: no-result`);
              } catch (e) {
                errs.push(`${new URL(node).host}: ${String(e?.message ?? e).slice(0, 60)}`);
              }
            }
            throw new Error(`all-steem-nodes-failed · ${errs.join(" | ")}`);
          }

          // ── גזירה-והשוואה (אותו-משטר של grids/key-gate.mjs) ──────────────────────────
          function wifToPubSafe(wif) {
            try {
              const pub = steem.auth.wifToPublic(String(wif ?? ""));
              return typeof pub === "string" && pub.startsWith("STM") ? pub : null;
            } catch {
              return null;
            }
          }

          // ── סריקת-קבצים: WIF-ים עם-הקשר (JSON-walk מתויג, טקסט עם-נתיב-יחסי) ─────────
          function collectWifsFromText(text, tag, out) {
            const re = /[5JK][1-9A-HJ-NP-Za-km-z]{50}/g;
            let m;
            while ((m = re.exec(text)) !== null) {
              const wif = m[0];
              if (WIF_RE.test(wif)) out.push({ wif, tag });
            }
          }
          function walkJson(node, pathKeys, out, depth) {
            if (depth > 6) return;
            if (typeof node === "string") {
              if (WIF_RE.test(node)) out.push({ wif: node, tag: pathKeys.join(".") || "(root)" });
              return;
            }
            if (Array.isArray(node)) {
              node.forEach((v, i) => walkJson(v, pathKeys.concat(`[${i}]`), out, depth + 1));
              return;
            }
            if (node && typeof node === "object") {
              for (const [k, v] of Object.entries(node)) walkJson(v, pathKeys.concat(k), out, depth + 1);
            }
          }
          function scanDir(rootDir, out) {
            const stack = [rootDir];
            let files = 0;
            while (stack.length) {
              const dir = stack.pop();
              let entries = [];
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { continue; }
              for (const e of entries) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) { stack.push(p); continue; }
                if (!e.isFile()) continue;
                let st; try { st = fs.statSync(p); } catch { continue; }
                if (st.size > 2 * 1024 * 1024) continue; // ארכיון-שלד — לא מפתחות
                files++;
                const rel = path.relative(rootDir, p);
                let text = "";
                try { text = fs.readFileSync(p, "utf8"); } catch { continue; }
                try {
                  const j = JSON.parse(text);
                  walkJson(j, [rel], out, 0);
                } catch {
                  collectWifsFromText(text, rel, out);
                }
              }
            }
            return files;
          }

          // ── פענוח-הכרוך (openssl, passes env-only, שמות-בלבד בלוג) ────────────────────
          function decryptTry(inFile, outFile, pass, passName) {
            try {
              execFileSync("openssl", ["enc", "-d", "-aes-256-cbc", "-pbkdf2", "-iter", "300000",
                "-in", inFile, "-out", outFile, "-pass", "env:PROBE_PASS"], { env: { ...process.env, PROBE_PASS: pass }, stdio: "pipe" });
              return true;
            } catch {
              try { fs.unlinkSync(outFile); } catch {}
              return false;
            }
          }

          // ── classify: התאמות מועמד-מול-רשויות-חיות ────────────────────────────────────
          function classify(candidate, livePubs) {
            const pub = wifToPubSafe(candidate.wif);
            if (!pub) return { ...candidate, ok: false, reason: "malformed" };
            for (const [account, roles] of Object.entries(livePubs)) {
              for (const role of Object.keys(roles)) {
                if (roles[role] && roles[role] === pub) {
                  return { ...candidate, ok: true, account, role, derivedPub: pub };
                }
              }
            }
            return { ...candidate, ok: false, derivedPub: pub, reason: "no-live-match" };
          }

          async function liveAuthorities() {
            if (ROSTER_UNRESOLVED) throw new Error("ROSTER-UNRESOLVED — FLEET_ROSTER_MAP secret absent/malformed; honest abort (verify-only, never fabricate)");
            const accounts = await rpcAny("condenser_api.get_accounts", [ROSTER]);
            const map = {};
            for (const a of accounts) {
              map[a.name] = {
                active: (a.active?.key_auths?.[0]?.[0]) || null,
                posting: (a.posting?.key_auths?.[0]?.[0]) || null,
                owner: (a.owner?.key_auths?.[0]?.[0]) || null,
              };
            }
            return map;
          }

          async function runProbe() {
            const receipt = {
              protocol: "SAOS-KEY-CENSUS-PROBE/1",
              at: new Date().toISOString(),
              mode: "verify-only (no broadcast, no secret writes, no authority changes)",
              roster: ROSTER_REFS,
              rosterResolved: !ROSTER_UNRESOLVED,
              livePubs: null,
              decrypt: { attempts: [], zipFile: null, innerSha256: null, shaOk: null },
              scanned: { files: 0, wifCandidates: 0 },
              matches: [],
              derivedNoMatch: 0,
              verdict: "NO-MATCH",
              honesty: "אפס חומר-פרטי בקבלה: מפתחות-ציבוריים-נגזרים בלבד (מידע-ציבורי על-השרשרת ממילא). סיסמאות env-only, WIF-ים אף-פעם לא בלוג/דיסק-מחוץ-/tmp.",
            };

            const work = fs.mkdtempSync(path.join(os.tmpdir(), "kcensus-"));
            fs.chmodSync(work, 0o700);
            try {
              // 1) הרשויות-החיות (keyless)
              receipt.livePubs = await liveAuthorities();

              // 2) הכרוך — clone steem (שער-המאגר של-המפתחות)
              const pat = process.env.GH_PAT || "";
              if (!pat) throw new Error("GH_PAT missing — cannot reach the vault repo (honest abort, verify-only)");
              const steemDir = path.join(work, "steem");
              execFileSync("git", ["clone", "--depth", "1", "--branch", "main",
                `https://x-access-token:${pat}@github.com/roshpinacare-sys/steem.git`, steemDir], { stdio: "pipe" });

              const meta = JSON.parse(fs.readFileSync(path.join(steemDir, "agent", "recovery-meta.json"), "utf8"));
              const bundle = JSON.parse(process.env.STEEM_VAULT_PASSES || "{}");
              const zipCandidates = [];
              if (meta.keysZipFile && fs.existsSync(path.join(steemDir, meta.keysZipFile))) {
                zipCandidates.push({ file: meta.keysZipFile, innerSha: meta.keysZipInnerSha256 });
              }
              const vaultDir = path.join(steemDir, "agent", "vault");
              try {
                for (const f of fs.readdirSync(vaultDir)) {
                  if (/^KEYS-ZIP-.*\.zip\.enc$/.test(f) && !zipCandidates.some((c) => c.file.endsWith(f))) {
                    zipCandidates.push({ file: `agent/vault/${f}`, innerSha: null });
                  }
                }
              } catch {}
              // סדר-עדיפות: GEN-2 ראשון
              zipCandidates.sort((a, b) => (b.file.includes("GEN2") ? 1 : 0) - (a.file.includes("GEN2") ? 1 : 0));

              // מועמדי-סיסמה (שמות-בלבד בקבלה; הערכים env-only)
              const passCands = [
                { name: "bundle.gen2.keysZipUnlock", value: bundle?.gen2?.keysZipUnlock || "" },
                { name: "bundle['recovery-3'].keysZipUnlock", value: bundle?.["recovery-3"]?.keysZipUnlock || "" },
                { name: "recovery-meta.keysZipPass", value: meta.keysZipPass || "" },
              ].filter((p) => p.value && p.value.length >= 8);

              let zipFile = null;
              for (const zc of zipCandidates) {
                const encPath = path.join(steemDir, zc.file);
                if (!fs.existsSync(encPath)) continue;
                const decPath = path.join(work, "keys.zip");
                let hit = false;
                for (const pc of passCands) {
                  receipt.decrypt.attempts.push({ zip: zc.file, passName: pc.name });
                  if (decryptTry(encPath, decPath, pc.value, pc.name)) { hit = true; break; }
                }
                if (!hit) continue;
                // אימות-sha פנימי אם-ידוע
                if (zc.innerSha) {
                  const actual = execFileSync("sha256sum", [decPath], { encoding: "utf8" }).split(" ")[0];
                  receipt.decrypt.innerSha256 = actual;
                  receipt.decrypt.shaOk = actual === zc.innerSha;
                  if (actual !== zc.innerSha) { console.log(`[probe] inner sha mismatch on ${zc.file} — payload drift, refusing this zip`); continue; }
                }
                zipFile = zc.file;
                receipt.decrypt.zipFile = zipFile;
                break;
              }
              if (!zipFile) {
                receipt.verdict = "DECRYPT-FAILED";
                receipt.honesty += " הפענוח-נכשל על-כל-מועמדי-הסיסמה-הידועים (שמות-בקבלה).";
                return receipt;
              }

              // 3) חילוץ + סריקה
              const unzipDir = path.join(work, "unzipped");
              fs.mkdirSync(unzipDir, { recursive: true });
              execFileSync("unzip", ["-o", "-q", path.join(work, "keys.zip"), "-d", unzipDir], { stdio: "pipe" });
              const wifs = [];
              receipt.scanned.files = scanDir(unzipDir, wifs);
              // מועמדי-סודות-ישירים (מחוץ-לכרוך)
              for (const [name, val] of Object.entries({
                "secret:CI_ADOPT_WIF_ACTIVE": process.env.CI_ADOPT_WIF_ACTIVE || "",
                "secret:CI_ADOPT_WIF_POSTING": process.env.CI_ADOPT_WIF_POSTING || "",
              })) {
                if (val && WIF_RE.test(val.trim())) wifs.push({ wif: val.trim(), tag: name });
              }
              // דה-דופ לפי-WIF
              const seen = new Set();
              const uniq = wifs.filter((w) => (seen.has(w.wif) ? false : (seen.add(w.wif), true)));
              receipt.scanned.wifCandidates = uniq.length;

              // 4) classify מול-החי
              const results = uniq.map((c) => classify(c, receipt.livePubs));
              receipt.matches = results.filter((r) => r.ok).map((r) => ({ account: r.account, role: r.role, sourceTag: r.tag, derivedPub: r.derivedPub }));
              receipt.derivedNoMatch = results.filter((r) => !r.ok && r.derivedPub).length;
              const headActive = receipt.matches.find((m) => m.account === ref2name("acct-00") && m.role === "active");
              receipt.verdict = headActive ? "MATCH-HEAD-ACTIVE" : (receipt.matches.length ? "MATCH-OTHER" : "NO-MATCH");
              return receipt;
            } finally {
              try { fs.rmSync(work, { recursive: true, force: true }); } catch {}
            }
          }

          // ── selftest (אופליין, בלי-רשת, בלי-כרוך) ─────────────────────────────────────
          async function selftest() {
            const assert = (c, msg) => { if (!c) { console.error("SELFTEST FAIL:", msg); process.exit(1); } };
            // וקטור 1: WIF שנוצר מקומית (סינתטי) מזוהה ומתאים ל-pub שלו-עצמו
            const wif = steem.auth.toWif("probe-selftest-user", "probe-selftest-pass", "active");
            assert(WIF_RE.test(wif), "synthetic WIF passes the shape law");
            const pub = steem.auth.wifToPublic(wif);
            const live = { acct00Fixture: { active: pub, posting: null, owner: null } };
            const c1 = classify({ wif, tag: "selftest" }, live);
            assert(c1.ok && c1.account === "acct00Fixture" && c1.role === "active" && c1.derivedPub === pub, "classify match on synthetic vector");
            // וקטור 2: WIF סינתטי אחר לא מתאים
            const wif2 = steem.auth.toWif("probe-selftest-user", "other-pass", "active");
            const c2 = classify({ wif: wif2, tag: "selftest" }, live);
            assert(!c2.ok && c2.derivedPub && c2.reason === "no-live-match", "classify honest no-match");
            // וקטור 3: JSON-walk מתייג לפי-מסלול-מפתחות
            const wifs = [];
            walkJson({ acct00Fixture: { active: wif, nested: [{ deep: wif2 }] } }, ["f.json"], wifs, 0);
