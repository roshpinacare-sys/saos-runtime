                        e.gens.push({ gen: genLabel, wif: c.wif, pub: r.derivedPub || null, activeWif: null, activePub: null });
                        byAccount.set(r.account, e);
                        missingSet.delete(r.account);
                        console.log(`army-cache-resolve: LADDER ${r.account} LIVE-MATCH via ${bf} (posting) — ${genLabel}`);
                      } else if (r.role === "active" && !e.activeWif) {
                        e.gens.push({ gen: genLabel, wif: null, pub: null, activeWif: c.wif, activePub: r.derivedPub || null });
                        byAccount.set(r.account, e);
                        console.log(`army-cache-resolve: LADDER ${r.account} LIVE-MATCH via ${bf} (active) — ${genLabel}`);
