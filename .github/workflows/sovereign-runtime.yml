            try { cache = JSON.parse(fs.readFileSync(CACHE, "utf8")); } catch (e) { console.log("::warning::ROT2-RAIL: cache unparseable — honest no-op"); return; }
            if (!Array.isArray(cache.accounts)) { console.log("::warning::ROT2-RAIL: cache schema unexpected — honest no-op"); return; }

            const cands = [];
            const bridging = [];
            for (const [ref, mat] of Object.entries(steemMap)) {
