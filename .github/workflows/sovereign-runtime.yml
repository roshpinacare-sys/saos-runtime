              if (m && m.names) Object.assign(f, m.names);
              for (const [k, v] of Object.entries(m || {})) if (typeof k === "string" && typeof v === "string") f[k] = v;
              for (const [k, v] of Object.entries(f)) {
                if (k.startsWith("acct-")) { REFS.r2n[k] = v; REFS.n2r[v] = k; } else { REFS.n2r[k] = v; REFS.r2n[v] = k; }
              }
