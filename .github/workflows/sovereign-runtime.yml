                 * then generation-ladder gens (chain-verified material from older seals) —
                 * adoptFromCache picks the FIRST gen with material, the chain judges it. */
                const gens = [{ gen: "GEN-2", wif: e.wif ?? null, pub: e.pub ?? null, activeWif: e.activeWif ?? null, activePub: e.activePub ?? null }, ...(e.gens || [])]
                  .filter((g) => g && (g.wif || g.activeWif));
                if (!gens.length) return null;
                return { name, gens };
              }).filter(Boolean);
              const cache = {
                extractedAt: new Date().toISOString(),
                generations: [{ gen: "GEN-2", outerSha: outerSha.slice(0, 8), innerSha: innerSha.slice(0, 8) }],
                errors: [],
                accounts,
              };

              /* atomic 0600 write (engine law R235): tmp + rename, dir 0700. */
