              const name = REFS.r2n[ref] || (ref.startsWith("acct-") ? null : ref);
              if (!name) {
                /* R327-b FINGERPRINT BRIDGE candidates: an unresolvable ref is NOT a dead end —
                 * the map hole (measured: acct-06 lost in the ROT2 re-seal, loud since 10-12) must
                 * not silence material that the CHAIN can bind by itself. The material's derived
                 * pubkey is compared against every roster account's LIVE chain authority below;
                 * a match binds ref→account BY THE CHAIN'S OWN JUDGMENT (never guessed), a
                 * non-match is refused loud. The map repair stays the standing owner lane. */
                const postingWif = (mat && mat.posting && mat.posting.wif) || null;
                const activeWif = (mat && mat.active && mat.active.wif) || null;
                if (postingWif || activeWif) bridging.push({ ref, name: null, postingWif, activeWif });
                else say("ref " + ref + " unresolvable and material-less — skipped LOUD (map repair stays the standing owner lane)");
                continue;
              }
              const postingWif = (mat && mat.posting && mat.posting.wif) || null;
              const activeWif = (mat && mat.active && mat.active.wif) || null;
              if (!postingWif && !activeWif) continue;
              cands.push({ ref, name, postingWif, activeWif });
