name: arsenal-sentinel

# [W4-G] שומר-הארסנל — מוכיח כל-6-שעות שכלי-ההישרדות קיימים על main ב-hub
# ושאפס סודות בעץ. כשל כאן = מישהו מחק כלי-תחייה או הדליף סוד — עוצרים-הכל.
# רץ מ-saos-runtime (בית-האקשנס-המוכח; נמדד: startup-failure של וורקפלו-ראשון ב-hub
# בן-שנייה-אחת עם אפס-צעדים — השומר גר שם-שיש-בו-רגליים).
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the hub (arsenal home)
        uses: actions/checkout@v4
        with:
          repository: roshpinacare-sys/saos-owner-channel
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: arsenal-integrity (every resurrection tool must exist on main)
        run: |
          set -e
          MISSING=0
          for f in \
            BOOTSTRAP.sh \
            BOOTSTRAP-COMMAND-CENTER.sh \
            RECOVER-ALL.sh \
            AGENT-MANUAL.md \
            RESURRECTION.md \
            command-center/worklog.md \
            command-center/src/app/page.tsx \
            command-center/src/lib/sovereign.ts \
            command-center/src/app/api/sovereign/route.ts ; do
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "OK  $f"
            else
              echo "MISSING  $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::arsenal broken — a resurrection tool vanished from main"
            exit 1
          fi

      - name: zero-secrets-sweep (no pat/env/key files may live in git)
        run: |
          set -e
          HITS=$(git ls-files | grep -E '(^|/)(pat\.env|\.env(\..+)?|.*\.pem|id_rsa.*|id_ed25519.*|.*credentials.*|.*token\.(env|txt|key))$' || true)
          if [ -n "$HITS" ]; then
            echo "::error::secret-named files tracked in git:"
            echo "$HITS"
            exit 1
          fi
          echo "clean: 0 secret-named files tracked"

      - name: executable-bits (bootstrap scripts must stay runnable)
        run: |
          set -e
          BAD=0
          for f in BOOTSTRAP.sh BOOTSTRAP-COMMAND-CENTER.sh RECOVER-ALL.sh; do
            MODE=$(git ls-files -s "$f" | awk '{print $1}')
            case "$MODE" in
              100755) echo "OK  $f is +x" ;;
              *) echo "NOT-EXECUTABLE $f ($MODE)"; BAD=1 ;;
            esac
          done
          [ "$BAD" = "0" ] || { echo "::error::bootstrap scripts lost +x"; exit 1; }
