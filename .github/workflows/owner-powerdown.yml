# owner-powerdown.yml (saos-runtime) — W2: owner EXPLICIT instruction, 2026-10-18.
#
# Owner word (IM, this session): "לבצע downpower של 1000 Steem נוספים (מ-SP לנזיל)" —
# the explicit new owner instruction that DIRECTIVE-R24's fail-closed powerdown lock
# itself names as its only unlock ("requires explicit new owner instruction to unlock",
# saos-dex src/lib/dex/realmarket.ts). Domain: FLEET/estate power (saos-runtime), NOT
# the DEX domain — the R24 route/lib locks stay untouched there.
# Purpose: no posts for now → liquid fuel for the grid army (army-ladder), the DEX
# liquidity lanes, and fleet-fuel top-ups. Previous measured powerdown: txid 6e881cd4
# (1,746.9 SP, completed — wdWk=0 on-chain today, head 2026-10-18).
#
# Gates (fail-closed at every step; the key is never logged, never written to disk):
#   G0  amount ≤ 1000 SP per THIS authorization (hard cap in code; a new raise = new
#       owner word + a commit changing it).
#   G1  WIF parses + derives (graphene WIF checksum + pubkey derivation).
#   G2  derived pubkey ∈ LIVE active authorities of acct-00 (measured from node —
#       estate-pseudonym law: the real name is resolved only via FLEET_ROSTER_MAP).
#   G3  RC-fuel preserve: SP remaining powered ≥ 150 SP (feat-62 law: RC anchors do
#       not strangle).
#   G4  idempotent: existing to_withdraw ≥ target → honest skip (safe re-runs).
#   G5  dry_run=true (default) = gates + computed target only, zero broadcast.
#   G6  post-broadcast chain re-verification (to_withdraw must reflect the target).
#
# Weekly inflow under Steem HF: target/4 per week (4-week powerdown, measured in feat 62).
# 1000 SP → 250 STEEM/week × 4 weeks into headcorner liquid — fuel for the army.
name: owner-powerdown

on:
  workflow_dispatch:
    inputs:
      amount_sp:
        description: 'SP to add to the vesting withdrawal (hard cap 1000 this authorization)'
        default: '1000'
      dry_run:
        description: 'true = gates + computed target only (no broadcast)'
        default: 'true'

permissions:
  contents: read

concurrency:
  group: owner-powerdown
  cancel-in-progress: false

jobs:
  powerdown:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STEEM_ACTIVE_WIF: ${{ secrets.STEEM_ACTIVE_WIF }}
      FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }}
      IN_AMOUNT: ${{ github.event.inputs.amount_sp }}
      IN_DRY: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Gates + withdraw_vesting (fail-closed, key never logged)
        run: |
          set -Eeuo pipefail
          npm install --prefix /tmp/deps @noble/secp256k1@2.2.3 --omit=dev --no-audit --no-fund --loglevel=error
          npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/deps/node_modules:/tmp/steemjs/node_modules node << 'EOS'
          const crypto = require('crypto');
          const secp = require('@noble/secp256k1');
          const steem = require('steem');
          secp.etc.hmacSha256Sync = (key, ...msgs) => {
            const h = crypto.createHmac('sha256', Buffer.from(key));
            msgs.forEach((m) => h.update(Buffer.from(m)));
            return new Uint8Array(h.digest());
          };
          const sha256 = (b) => crypto.createHash('sha256').update(b).digest();
          const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
          const fail = (v, r) => { console.log(JSON.stringify({ verdict: v, reason: String(r).slice(0, 300) })); process.exit(1); };
          // estate-pseudonym law (same resolver as owner-key-adopt): refs only in code.
          const REF2NAME = (() => { try { const m = JSON.parse(process.env.FLEET_ROSTER_MAP || ''); const f = {}; if (m && m.refs) Object.assign(f, m.refs); if (m && m.names) Object.assign(f, m.names); for (const [k, v] of Object.entries(m || {})) if (typeof v === 'string') f[k] = v; const out = {}; for (const [k, v] of Object.entries(f)) { if (k.startsWith('acct-')) out[k] = v; else out[v] = k; } return out; } catch { return {}; } })();
          const b58dec = (s) => {
            let n = 0n;
            for (const c of s) { const i = B58.indexOf(c); if (i < 0) throw new Error('bad-b58'); n = n * 58n + BigInt(i); }
            let h = n.toString(16).padStart(2, '0'); if (h.length % 2) h = '0' + h;
            const buf = Buffer.from(h, 'hex');
            let pad = 0;
            for (const c of s) { if (c === '1') pad++; else break; }
            return Buffer.concat([Buffer.alloc(pad), buf]);
          };
          const NODES = ['https://api.steemit.com', 'https://api.justyy.com', 'https://steem-rpc.publicnode.com'];
          async function rpc(node, method, params) {
            const res = await fetch(node, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }), signal: AbortSignal.timeout(15000) });
            const j = await res.json();
            if (j.error) throw new Error((j.error.message || 'rpc-error').slice(0, 200));
            return j.result;
          }
          const AUTH_CAP_SP = 1000;   // G0 — THIS owner authorization's hard cap (2026-10-18)
          const RC_FUEL_SP = 150;     // G3 — feat-62 RC-anchor law
          (async () => {
            const ACCOUNT = REF2NAME['acct-00'];
            if (!ACCOUNT) return fail('ROSTER-UNRESOLVED', 'acct-00 not resolvable from FLEET_ROSTER_MAP — fail-honest (never fabricate)');
            const DRY = String(process.env.IN_DRY ?? 'true') === 'true';
            const amt = Number(process.env.IN_AMOUNT || '1000');
            if (!Number.isFinite(amt) || amt <= 0) return fail('BAD-AMOUNT', 'amount_sp must be a positive number');
            if (amt > AUTH_CAP_SP) return fail('CAP-EXCEEDED', `amount ${amt} > ${AUTH_CAP_SP} SP — hard cap of the 2026-10-18 owner authorization`);
            const WIF = (process.env.STEEM_ACTIVE_WIF || '').trim();
            if (!WIF) return fail('NO-SECRET', 'STEEM_ACTIVE_WIF missing — the powerdown sleeps honestly UNARMED (owner one-action pending)');
            // G1 — parse + derive
            let priv, derived;
            try {
              let w = WIF;
              if (w.length === 52 && w.startsWith('P')) w = w.slice(1);
              const dec = b58dec(w);
              // dual-form WIF (house parser, mirrors hive-revival wifDecode): 37 = raw,
              // 38 = compressed (0x80+priv+0x01). Both live in the wild — measured.
              let payload, privBytes;
              if (dec.length === 38) { payload = dec.slice(0, 34); if (payload[0] !== 0x80 || payload[33] !== 0x01) throw new Error('wif-form-38'); privBytes = payload.slice(1, 33); }
              else if (dec.length === 37) { payload = dec.slice(0, 33); if (payload[0] !== 0x80) throw new Error('wif-form-37'); privBytes = payload.slice(1); }
              else throw new Error('wif-len-' + dec.length);
              if (!sha256(sha256(payload)).slice(0, 4).equals(dec.slice(-4))) throw new Error('wif-checksum');
              priv = privBytes;
              derived = 'STM' + (() => {
                const p33 = Buffer.from(secp.getPublicKey(priv, true));
                const full = Buffer.concat([p33, crypto.createHash('ripemd160').update(p33).digest().slice(0, 4)]);
                let n = 0n;
                for (const x of full) n = n * 256n + BigInt(x);
                let s = '';
                while (n > 0n) { s = B58[Number(n % 58n)] + s; n /= 58n; }
                for (const x of full) { if (x === 0) s = '1' + s; else break; }
                return s;
              })();
            } catch (e) { return fail('BAD-WIF', e.message); }
            // live account + G2 (derived ∈ LIVE active authorities)
            let acc, nodeUsed = '';
            for (const node of NODES) {
              try { const a = await rpc(node, 'condenser_api.get_accounts', [[ACCOUNT]]); if (a && a[0]) { acc = a[0]; nodeUsed = new URL(node).host; break; } } catch (e) { /* next */ }
            }
            if (!acc) return fail('ACCOUNT-LOOKUP-FAIL', 'all nodes failed');
            const liveActive = (acc.active && acc.active.key_auths ? acc.active.key_auths : []).map((x) => x[0]);
            if (!liveActive.includes(derived)) return fail('KEY-NOT-AUTHORIZED', 'derived active pubkey is NOT on the LIVE active authority of ' + 'acct-00 — refuse (fail-closed)');
            // live ratio + amounts
            let dgpo;
            for (const node of NODES) { try { dgpo = await rpc(node, 'condenser_api.get_dynamic_global_properties', []); if (dgpo) break; } catch (e) { /* next */ } }
            if (!dgpo) return fail('DGPO-FAIL', 'global properties unreachable');
            const ratio = parseFloat(dgpo.total_vesting_fund_steem) / parseFloat(dgpo.total_vesting_shares); // SP per VESTS
            const spOf = (vests) => parseFloat(vests) * ratio;
            const vestsOfSp = (sp) => Math.floor(sp / ratio); // whole VESTS, floor (never over-withdraw)
            const spNow = spOf(acc.vesting_shares);
            const withdrawnV = parseFloat(acc.withdrawn || '0');
            const toWithdrawV = parseFloat(acc.to_withdraw || '0');
            const addV = vestsOfSp(amt);
            const targetV = withdrawnV + addV;
            // G4 — idempotence
            if (toWithdrawV >= targetV) {
              console.log(JSON.stringify({ verdict: 'ALREADY-ARMED', account_ref: 'acct-00', to_withdraw_vests: toWithdrawV, target_vests: targetV, note: 'existing vesting withdrawal already covers the target — honest skip (safe re-run)' }));
              return;
            }
            // G3 — RC-fuel preserve
            const spAfter = spNow - (targetV - withdrawnV) * ratio;
            if (spAfter < RC_FUEL_SP) return fail('RC-FUEL-GUARD', `SP after powerdown ${spAfter.toFixed(1)} < ${RC_FUEL_SP} (feat-62 RC-anchor law)`);
            const weeklySp = (targetV - withdrawnV) * ratio / 4;
            console.log(JSON.stringify({ step: 'gates-passed', account_ref: 'acct-00', node: nodeUsed, sp_now: spNow.toFixed(1), amount_sp: amt, target_vests: targetV, weekly_sp: weeklySp.toFixed(1), dry_run: DRY }));
            if (DRY) { console.log(JSON.stringify({ verdict: 'DRY-RUN-GREEN', note: 'gates green, zero broadcast — dispatch with dry_run=false to execute' })); return; }
            // broadcast (steem-js handles graphene serialization + signing)
            steem.api.setNodes(NODES.map((n) => n));
            const vsStr = (targetV / 1e6).toFixed(6) + ' VESTS';
            let txid = null;
            try {
              const res = await new Promise((resolve, reject) => {
                steem.broadcast.withdrawVesting(WIF, ACCOUNT, vsStr, (err, r) => err ? reject(err) : resolve(r));
              });
              txid = res && res.id ? res.id : null;
            } catch (e) { return fail('BROADCAST-FAIL', String(e && e.message || e).slice(0, 250)); }
            // G6 — chain re-verification
            let acc2 = null;
            for (const node of NODES) { try { const a = await rpc(node, 'condenser_api.get_accounts', [[ACCOUNT]]); if (a && a[0]) { acc2 = a[0]; break; } } catch (e) { /* next */ } }
            const ok2 = acc2 && parseFloat(acc2.to_withdraw || '0') >= targetV - 1e6; // 1 VESTS tolerance
            if (!ok2) return fail('VERIFY-FAIL', 'post-broadcast to_withdraw does not reflect the target — honest fail');
            console.log('POWERDOWN-RECEIPT ' + JSON.stringify({ verdict: 'EXECUTED', account_ref: 'acct-00', txid, target_vests: targetV, target_sp: amt, weekly_sp: Number(weeklySp.toFixed(1)), added_to_existing: toWithdrawV > 0, at: new Date().toISOString() }));
          })().catch((e) => fail('UNEXPECTED', e && e.message || e));
          EOS

      - name: Honest summary
        if: always()
        run: echo "owner-powerdown step done (verdict above — fail-closed at every gate)"
