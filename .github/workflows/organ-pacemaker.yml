name: organ-pacemaker

# [W5] שומר-הקצב לאיברי-ההכנסה — תבנית-ה-catchup שהוכחה על dex-beat (W4-C),
# מורחבת לכל איבר-הכנסה. נמדד 2026-10-18: fleet-fuel שקט 9h בקצב-2h,
# treasury-ladder שקט 12h בקצב-7h — GitHub-scheduler מדלג-בשקט; הפייסמייקר הוא הריפא.
# חוק: dispatch בלבד — לא מריץ-לוגיקה בעצמו, לא נוגע בכספות, לא מדלג על הסגרים.
on:
  schedule:
    - cron: "23 * * * *" # שעתית :23 — מחוץ-לפסים :21/:51/:53 העמוסים
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: organ-pacemaker
  cancel-in-progress: false

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: stale-organ detection + dispatch (receipts in log)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'PYEOF'
          import json, os, time, urllib.request

          GH = "https://api.github.com"
          REPO = "roshpinacare-sys/saos-runtime"
          TOK = os.environ["GH_TOKEN"]
          # organ → (workflow file, fresh-window seconds, grace seconds, dispatch inputs)
          # [W11 zai 19.10] full-coverage round — owner order: "הארכיטקטורה הריבונית
          # תדע להשתמש ולתפעל את הכל ברמה הכי גבוהה". 5 organs joined:
          #   army-ladder    — hourly :41 cron but GitHub DROPS slots on busy repos
          #                    (measured: last success 2.1h with hourly cron) → healed here;
          #   self-memory,
          #   system-map     — dispatch-only since birth, never run (לא-נצפה on the board);
          #   escrow-payroll — dispatch-only; canary payroll, owner mandate R30 full-lift
          #                    (dust amounts, hard caps in code, chain-idempotent, confirm=ESCROW);
          #   directive-now  — dispatch-only; default task health-probe (read-only broadcast).
          # dispatch inputs passed only where the workflow defines them (GitHub 422s
          # on unknown inputs). Anti-spam law added: a never-succeeded organ is
          # dispatched at most once per fresh+grace window (was: EVERY hourly tick
          # — an hourly red loop waiting to happen on a 93600s-window organ).
          ORGANS = {
              "fleet-fuel":      ("fleet-fuel.yml",      7200,  3600, {}),
              "treasury-ladder": ("treasury-ladder.yml", 25200, 3600, {}),
              "sovereign-pulse": ("sovereign-pulse.yml", 23400, 3600, {}),
              "grid-watchdog":   ("grid-watchdog.yml",   5400,  3600, {}),
              "army-ladder":     ("army-ladder.yml",     5400,  3600, {}),
              "self-memory":     ("self-memory.yml",    93600,  3600, {}),
              "system-map":      ("system-map.yml",     93600,  3600, {}),
              "escrow-payroll":  ("escrow-payroll.yml", 93600,  3600, {"confirm": "ESCROW"}),
              "directive-now":   ("directive-now.yml",  93600,  3600, {}),
          }

          def api(path, method="GET", body=None):
              req = urllib.request.Request(
                  GH + path,
                  method=method,
                  headers={"Authorization": "Bearer " + TOK,
                           "Accept": "application/vnd.github+json",
                           # W12 ROOT-CAUSE (measured 01:27Z): without an explicit
                           # Content-Type, GitHub parsed {"ref":"main"} (dispatch
                           # created, 204) but DROPPED the "inputs" — escrow-payroll
                           # ran with confirm empty → CONFIRM-REFUSED hard-fail on
                           # every pacemaker dispatch. application/json fixes it
                           # (verified live: same dispatch with the header passed
                           # the Confirm friction gate for the first time).
                           "Content-Type": "application/json",
                           "User-Agent": "organ-pacemaker"},
                  data=json.dumps(body).encode() if body else None)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or "{}")

          def dispatch(wfile, inputs):
              body = {"ref": "main"}
              if inputs:
                  body["inputs"] = inputs
              api(f"/repos/{REPO}/actions/workflows/{wfile}/dispatches", "POST", body)

          receipts = []
          for name, (wfile, fresh, grace, inputs) in ORGANS.items():
              try:
                  runs = api(f"/repos/{REPO}/actions/workflows/{wfile}/runs?per_page=10").get("workflow_runs", [])
                  ok = [r for r in runs if r["conclusion"] == "success"]
                  if not ok:
                      # never succeeded (maybe never ran): dispatch, but at most once
                      # per window — a recent failed attempt means the verdict is
                      # already loud on the board; spamming it hourly heals nothing.
                      if runs:
                          last_any = time.time() - time.mktime(time.strptime(runs[0]["created_at"], "%Y-%m-%dT%H:%M:%SZ")) - time.timezone
                      else:
                          last_any = None
                      if last_any is None or last_any > fresh + grace:
                          dispatch(wfile, inputs)
                          receipts.append({"organ": name, "verdict": "NEVER-RUN-DISPATCHED" if last_any is None else "NEVER-SUCCEEDED-DISPATCHED",
                                           "lastAnyAgeSec": last_any is not None and int(last_any), "dispatched": True})
                      else:
                          receipts.append({"organ": name, "verdict": "ATTEMPT-PENDING",
                                           "lastAnyAgeSec": int(last_any), "dispatched": False})
                      continue
                  age = time.time() - time.mktime(time.strptime(ok[0]["created_at"], "%Y-%m-%dT%H:%M:%SZ")) - time.timezone
                  limit = fresh + grace
                  stale = age > limit
                  if stale:
                      dispatch(wfile, inputs)
                  receipts.append({"organ": name, "verdict": "STALE-DISPATCHED" if stale else "FRESH",
                                   "ageSec": int(age), "limitSec": limit, "dispatched": stale})
              except Exception as e:
                  receipts.append({"organ": name, "verdict": "ERROR", "error": str(e)[:150]})

          print(json.dumps({"at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "receipts": receipts}, indent=1))
          bad = [r for r in receipts if r["verdict"] == "ERROR"]
          if len(bad) >= 3:
              raise SystemExit("pacemaker: 3+ organ errors — API plumbing broken, fail-honest")
          PYEOF
