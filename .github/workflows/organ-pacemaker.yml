name: organ-pacemaker

# [W5] שומר-הקצב לאיברי-ההכנסה — תבנית-ה-catchup שהוכחה על dex-beat (W4-C),
# מורחבת לכל איבר-הכנסה. נמדד 2026-10-18: fleet-fuel שקט 9h בקצב-2h,
# treasury-ladder שקט 12h בקצב-7h — GitHub-scheduler מדלג-בשקט; הפייסמייקר הוא הריפא.
# חוק: dispatch בלבד — לא מריץ-לוגיקה בעצמו, לא נוגע בכספות, לא מדלג על הסגרים.
on:
  schedule:
    - cron: "23 * * * *" # שעתית :23 — מחוץ-לפסים :21/:51/:53 העמוסים
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: organ-pacemaker
  cancel-in-progress: false

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: stale-organ detection + dispatch (receipts in log)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - << 'PYEOF'
          import json, os, time, urllib.request

          GH = "https://api.github.com"
          REPO = "roshpinacare-sys/saos-runtime"
          TOK = os.environ["GH_TOKEN"]
          # organ → (workflow file, fresh-window seconds, grace seconds)
          ORGANS = {
              "fleet-fuel":      ("fleet-fuel.yml",      7200,  3600),
              "treasury-ladder": ("treasury-ladder.yml", 25200, 3600),
              "sovereign-pulse": ("sovereign-pulse.yml", 23400, 3600),
              "grid-watchdog":   ("grid-watchdog.yml",   5400,  3600),
          }

          def api(path, method="GET", body=None):
              req = urllib.request.Request(
                  GH + path,
                  method=method,
                  headers={"Authorization": "Bearer " + TOK,
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "organ-pacemaker"},
                  data=json.dumps(body).encode() if body else None)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode() or "{}")

          receipts = []
          for name, (wfile, fresh, grace) in ORGANS.items():
              try:
                  runs = api(f"/repos/{REPO}/actions/workflows/{wfile}/runs?per_page=10").get("workflow_runs", [])
                  ok = [r for r in runs if r["conclusion"] == "success"]
                  if not ok:
                      receipts.append({"organ": name, "verdict": "NEVER-SUCCEEDED", "dispatched": True})
                      api(f"/repos/{REPO}/actions/workflows/{wfile}/dispatches", "POST", {"ref": "main"})
                      continue
                  age = time.time() - time.mktime(time.strptime(ok[0]["created_at"], "%Y-%m-%dT%H:%M:%SZ")) - time.timezone
                  limit = fresh + grace
                  stale = age > limit
                  if stale:
                      api(f"/repos/{REPO}/actions/workflows/{wfile}/dispatches", "POST", {"ref": "main"})
                  receipts.append({"organ": name, "verdict": "STALE-DISPATCHED" if stale else "FRESH",
                                   "ageSec": int(age), "limitSec": limit, "dispatched": stale})
              except Exception as e:
                  receipts.append({"organ": name, "verdict": "ERROR", "error": str(e)[:150]})

          print(json.dumps({"at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "receipts": receipts}, indent=1))
          bad = [r for r in receipts if r["verdict"] == "ERROR"]
          if len(bad) >= 3:
              raise SystemExit("pacemaker: 3+ organ errors — API plumbing broken, fail-honest")
          PYEOF
