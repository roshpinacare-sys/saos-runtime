# treasury-ladder.yml (saos-runtime) — R16-b: the treasury's own income artery, canary-first.
#
# Owner traces 1a12…9391 ([owner-directive]) + 1a12…59b5 ([owner-directive]). The exhaustive key census (R16-b,
# 18 sealed bundles opened + full git-history pass mining + master-password derivation zoo) measured:
# acct-00's STEEM active key (10-08 rotation) exists in NO machine-held material — but the machine
# holds LIVE full control of 13 worker accounts. The treasury ladder runs the maker book on the
# escrow-agent account (acct-11) — an income artery NO owner key can block. (refs: estate-pseudonym law, wave 19)
#
# Safety: plan-file-only (SAOS-TREASURY-LADDER-PLAN/1) · canary caps forever in code (≤0.3/leg,
# ≤0.6 open STEEM) · key-gate vs LIVE authority per run · STASIS obeyed · maker-only (never cross) ·
# 7-day expiry (no zombies) · kill-law on >5% mid move · foreign orders NEVER touched ·
# read-after-write per tx · keys resolved in-run to a 0600 file, never logged, destroyed at end.
name: treasury-ladder

on:
  schedule:
    - cron: "47 3,9,15,21 * * *"   # W2 4×/day, offset away from the :00 cron storm —
                                   # the treasury maker book was dispatch-only before
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: treasury-ladder
  cancel-in-progress: false

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
      GH_PAT: ${{ secrets.GH_PAT }}
      # R324 wiring-fix: resolve-keys.cjs reads the census roster from ROT_ROSTER
      # (T-68 intel-by-law). The missing wire made get_accounts([]) return 0
      # accounts → "matched 0 live keys across 0 accounts" → honest abort →
      # a red run + operator email on every scheduled cycle. The secret exists
      # on this repo; the wire was simply absent. One line, root-cause closed.
      ROT_ROSTER: ${{ secrets.ROT_ROSTER }}
      # R324-EXAMINE-FIX: post-rotation fleet keys (ROT2, 00:05, chain-verified) — the
      # fresh source for resolve-keys. Without it the GEN-2 zip (pre-ROT2 payload) matched
      # 0 across 0 → KEYLESS-STASIS green-sleep. One line, additive, alive-wins.
      ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - name: Install signer lib (house pattern)
        run: npm install --prefix /tmp/steemjs steem@0.7.11 --omit=dev --no-audit --no-fund --loglevel=error

      - name: Checkout the grids home (saos-dex — engine of record)
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${GH_PAT}@github.com/roshpinacare-sys/saos-dex.git" dex
          echo "saos-dex @ $(cd dex && git rev-parse --short HEAD)"

      - name: Selftest gate (offline vectors — red selftest never reaches the chain)
        working-directory: dex
        run: |
          set -Eeuo pipefail
          npm install --omit=dev --no-audit --no-fund --loglevel=error bs58 steem@0.7.11 @noble/hashes @noble/curves
          NODE_PATH=/tmp/steemjs/node_modules node grids/treasury-ladder.mjs --selftest

      - name: Resolve live fleet keys from the sealed GEN-2 bundle (in-run, 0600, never logged)
        run: |
          # T-77 anti-flood: 0 live keys = honest KEYLESS-STASIS (a state, not a
          # failure). A red email 2x/day for a known owner-gated state recreated
          # the inbox flood the owner reported (trace 1a1374bc626866c9). The
          # stasis receipt IS the alarm — silence-watchdog pattern.
          if ! NODE_PATH=/tmp/steemjs/node_modules node ops/key-census-probe/resolve-keys.cjs --out /tmp/fk.json; then
            echo "KEYLESS-STASIS: 0 live keys — the ladder sleeps, honest receipt written"
            echo "stasis=1" >> "$GITHUB_ENV"
          fi

      - name: Treasury ladder cycle (maker-only, idempotent, key-gated, kill-law armed)
        if: env.stasis != '1'
        working-directory: dex
        run: NODE_PATH=/tmp/steemjs/node_modules node grids/treasury-ladder.mjs --run --keys-file /tmp/fk.json

      - name: Cleanup key material
        if: always()
        run: rm -f /tmp/fk.json && echo "key file destroyed"

      - name: Commit receipts to the grids home (evidence = commit; FF-only with yield)
        if: always()
        working-directory: dex
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add grids/state/treasury-receipts.jsonl grids/state/treasury-public.json grids/state/policy-gears.json grids/state/policy-ledger.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no receipt change — clean exit"
          else
            git commit -m "treasury-ladder: canary receipt $(date -u +%FT%TZ) [skip ci]"
            # the selftest's npm install dirties package-lock.json — clean it so the rebase-yield is free
            git checkout -- . 2>/dev/null || true
            for i in 1 2 3; do
              git pull --rebase -X theirs --autostash origin main && git push origin HEAD:main && break || { sleep $((i*5)); git rebase --abort 2>/dev/null || true; git checkout -- . 2>/dev/null || true; }
            done
          fi
