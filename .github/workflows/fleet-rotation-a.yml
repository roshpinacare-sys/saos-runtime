name: fleet-rotation-a

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ROT_STEEM_DIR: ${{ github.workspace }}/steem-engine
    steps:
      - uses: actions/checkout@v4
      - name: Probe (echo envs, no values)
        run: |
          echo "env-present: bundle=$([ -n "$STEEM_VAULT_PASSES" ] && echo yes || echo no) pat=$([ -n "$GH_PAT" ] && echo yes || echo no) ws=$ROT_STEEM_DIR"
          node --check ops/fleet-rotation/rotate.mjs && echo SYNTAX-OK
