# fleet-rotation-a — T-67 phase A + T-68 repair (trace 1a130a768c39d211): rotate EXPOSED army credentials.
#
# WHY: census-v2 receipts prove the army-account material is publicly recoverable since
# 2026-09-12 (R11 ALIVE-ALERT). Owner law tonight: "no keys in public, nothing exposed —
# they must not breach us." Phase A rotates every EXPOSED role EXCEPT owner authorities.
# Owner keys stay valid -> full recovery window. Phase B (owner rotation) = separate explicit dispatch.
#
# T-68 LAWS ADDED: roster arrives via the ROT_ROSTER secret (intel never in public code, fail-closed);
# the census probe dependency is restored code-only (crypto/scan helpers, env-driven roster);
# push-verify law on every push (the false-OK bug dies here).
#
# LAWS: byte-law vs node serialization; consensus digest without tx-level ext byte;
# signature self-verify; chain-judge pre AND post; incremental custody (secret PUT per account
# BEFORE the next broadcast); seal + meta v4 pushed to the private vault home; public receipt
# with fingerprints only. Fail-closed everywhere.
name: fleet-rotation-a

on:
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: fleet-rotation-a
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STEEM_VAULT_PASSES: ${{ secrets.STEEM_VAULT_PASSES }}
      ROT2_FLEET_KEYS: ${{ secrets.ROT2_FLEET_KEYS }} # R324 mirror: chain-verified post-rotation keys (custody-recover whole-map PUT) — the archive pool alone measured 0/54
      ROT_ROSTER: ${{ secrets.ROT_ROSTER }}
      GH_PAT: ${{ secrets.GH_PAT }}
      ROT_STEEM_DIR: ${{ github.workspace }}/steem-engine
    steps:
      - uses: actions/checkout@v5

      - name: Checkout steem main (custody branch — vault of record) + engine overlay (saos-cockpit)
        run: |
          set -Eeuo pipefail
          if [ -z "${GH_PAT:-}" ]; then echo "ABORT: GH_PAT absent"; exit 1; fi
          git clone --depth 1 --branch main "https://x-access-token:${GH_PAT}@github.com/roshpinacare-sys/steem.git" steem-engine
          cd steem-engine
          echo "steem main @ $(git rev-parse --short HEAD)"
          # T-68: the house serialization law (steemtx.mjs) lives on the saos-cockpit branch — overlay it onto main
          git fetch --depth 1 origin saos-cockpit
          git checkout FETCH_HEAD -- mini-services/saos-engine/steemtx.mjs
          node --check mini-services/saos-engine/steemtx.mjs
          echo "engine overlay ok: steemtx.mjs from saos-cockpit @ $(git rev-parse --short FETCH_HEAD)"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps (pinned)
        run: npm i --no-save --silent @noble/hashes@1.8.0 @noble/secp256k1@2.2.3 libsodium-wrappers steem

      - name: Preflight + selftest (zero network)
        run: |
          set -Eeuo pipefail
          if [ -z "${STEEM_VAULT_PASSES:-}" ]; then echo "ABORT: bundle absent"; exit 1; fi
          if [ -z "${ROT_ROSTER:-}" ]; then echo "ABORT: ROT_ROSTER absent — roster is intel-by-law, not code (fail-closed)"; exit 1; fi
          node -e "const r=JSON.parse(process.env.ROT_ROSTER); if(!Array.isArray(r.steemQuads)||!r.steemQuads.length||!Array.isArray(r.steemAct)||!Array.isArray(r.hiveAct)){console.error('ABORT: ROT_ROSTER malformed');process.exit(1)}; console.log('roster OK: groups='+[r.steemQuads.length,r.steemAct.length,r.hiveAct.length].join('/'))"
          node --check ops/fleet-rotation/rotate.mjs
          node ops/fleet-rotation/rotate.mjs --selftest

      - name: Match (open vault archives env-only, chain-judge, 0600 files)
        run: node ops/fleet-rotation/rotate.mjs --match /tmp/matched.json

      - name: Rotate phase A (broadcast, verify, incremental custody)
        run: node ops/fleet-rotation/rotate.mjs --rotate /tmp/matched.json /tmp/rot-result.json

      - name: Seal ROT2 archive + meta v4 + push steem (push verified, false-OK law)
        env:
          ROT_STEEM_DIR: ${{ github.workspace }}/steem-engine
        run: |
          set -Eeuo pipefail
          GEN2ZIP="$(node -e 'const b=JSON.parse(process.env.STEEM_VAULT_PASSES); process.stdout.write((b.gen2&&b.gen2.keysZipUnlock)||(b["recovery-3"]&&b["recovery-3"].keysZipUnlock)||"")')"
          export GEN2ZIP
          echo "::add-mask::$GEN2ZIP"
          if [ -z "$GEN2ZIP" ]; then echo "ABORT: no seal pass"; exit 1; fi
          python3 ops/fleet-rotation/seal_meta.py
          cd steem-engine
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add agent/vault/KEYS-ROT2-*.zip.enc agent/recovery-meta.json
          git commit -m "custody(T-67): ROT2 phase-A seal - exposed army credentials rotated (owner untouched), re-sealed under gen2-era pass, meta v4 inner-sha pinned"
          PUSHED=0
          for i in 1 2 3; do
            if git -c rebase.autoStash=true pull --rebase -X theirs origin main && git push origin HEAD:main; then PUSHED=1; break; fi
            sleep 5
          done
          [ "$PUSHED" = "1" ] || { echo "PUSH-FAIL: steem ROT2 seal push exhausted — failing honestly (false-OK law)"; exit 1; }
          sleep 2
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "PUSH-VERIFY-FAIL"; exit 1; fi
          echo "steem push verified: $(git rev-parse --short HEAD)"

      - name: Public receipt (fingerprints only)
        env:
          FLEET_ROSTER_MAP: ${{ secrets.FLEET_ROSTER_MAP }} # 3-c refs law: the public receipt speaks acct-NN refs, resolved here
        run: node ops/fleet-rotation/receipt.mjs /tmp/rot-result.json ops/fleet-rotation/receipt-A.json

      - name: Commit receipt to saos-runtime (push verified)
        run: |
          set -Eeuo pipefail
          git config user.name "roshpinacare-sys"
          git config user.email "326012154+roshpinacare-sys@users.noreply.github.com"
          git add ops/fleet-rotation/receipt-A.json
          git commit -m "fleet-rotation-a: phase A receipt $(date -u +%FT%TZ) [skip ci]" || echo "no receipt delta"
          for i in 1 2 3; do
            git pull --rebase -X theirs --autostash origin main && git push origin HEAD:main && break || sleep $((i*5))
          done
          sleep 2
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "PUSH-VERIFY-FAIL"; exit 1; fi

      - name: Verdict law (green only with real rotated accounts and custody)
        run: |
          set -Eeuo pipefail
          node ops/fleet-rotation/verdict.mjs ops/fleet-rotation/receipt-A.json
