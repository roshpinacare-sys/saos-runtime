# key-relay-to-autonomy.yml [t52 · agent-9] — מיסוך-מפתח-חד-פעמי-בין-בתי-סודות.
#
# המחלה-שנמדדה (t47→t52, קבלת-האוצר): CI_ADOPT_WIF_ACTIVE חי-כסוד-ענן-כאן
# (מעודכן 10-12) אבל הריצות-שצורכות-אותו-רצות-ב-Autonomy — וסודות-Actions
# הם-פר-ריפו. המנוע-שם מכריז על השם-הזה ברשמה-שלו (engine/runtime/keys.mjs
# REQUIRED_SECRETS) וממתין PENDING. העבודה-הזו מעבירה את-הערך מבלי שחומר-מפתח
# ייצא מזיכרון-הרץ: קריאה מ-env → crypto_box_seal מול המפתח-הציבורי-של
# Autonomy → PUT. אפס-הדפסה, אפס-דיסק, אפס-log. השער-היחיד-המדבר.
#
# חוקיות: (א) הסוד-כבר-קיים-כאן (לא-נוצר-כאן-שום-סוד) (ב) Autonomy מכריז-על-
# השם-ברשמה (ג) דפוס-ה-FF-sealed-box הוא-התקדים-t49 (sealed-rotate) (ד) additive
# בלבד — לא נוגע באף עבודה קיימת (ה) fail-closed: סוד-חסר = יציאה-כנה-1.
name: key-relay-to-autonomy
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: key-relay-to-autonomy
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CI_ADOPT_WIF_ACTIVE: ${{ secrets.CI_ADOPT_WIF_ACTIVE }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Relay CI_ADOPT_WIF_ACTIVE → Autonomy (sealed, memory-only)
        run: |
          set -Eeuo pipefail
          npm install --prefix /tmp/nacl tweetnacl@1.0.3 blake2b@2.1.4 --omit=dev --no-audit --no-fund --loglevel=error
          NODE_PATH=/tmp/nacl/node_modules node << 'EOS'
          (async () => {
          const nacl = require('tweetnacl');
          const blake2b = require('blake2b');
          const WIF = process.env.CI_ADOPT_WIF_ACTIVE || '';
          const PAT = process.env.GH_PAT || '';
          if (!WIF || WIF.length < 8) { console.log(JSON.stringify({verdict:'ABSENT-SOURCE', note:'CI_ADOPT_WIF_ACTIVE absent here — honest abort'})); process.exit(1); }
          if (!PAT) { console.log(JSON.stringify({verdict:'ABSENT-PAT', note:'GH_PAT absent — honest abort'})); process.exit(1); }
          const [OWNER, REPO] = ['roshpinacare-sys', 'Autonomy'];
          const H = { Authorization: `Bearer ${PAT}`, Accept: 'application/vnd.github+json' };
          const pk = await (await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/secrets/public-key`, { headers: H })).json();
          if (!pk.key) { console.log(JSON.stringify({verdict:'NO-PUBKEY'})); process.exit(1); }
          const keyBytes = Buffer.from(pk.key, 'base64');
          const eph = nacl.box.keyPair();
          const h = blake2b(24); h.update(Buffer.concat([Buffer.from(eph.publicKey), keyBytes]));
          const boxed = nacl.box(Buffer.from(WIF, 'utf8'), Buffer.from(h.digest()), keyBytes, eph.secretKey);
          const sealed = Buffer.concat([eph.publicKey, boxed]).toString('base64');
          const put = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/secrets/CI_ADOPT_WIF_ACTIVE`, {
            method: 'PUT', headers: { ...H, 'Content-Type': 'application/json' },
            body: JSON.stringify({ encrypted_value: sealed, key_id: pk.key_id }),
          });
          console.log(JSON.stringify({ verdict: [200,201,204].includes(put.status) ? 'RELAYED' : 'PUT-FAIL', http: put.status, target: `${OWNER}/${REPO}`, secret: 'CI_ADOPT_WIF_ACTIVE', note: 'value sealed in memory, never echoed' }));
          process.exit([200,201,204].includes(put.status) ? 0 : 1);
          })().catch(e => { console.log(JSON.stringify({verdict:'THROW', note:String(e && e.message || e).slice(0,120)})); process.exit(1); });
          EOS
